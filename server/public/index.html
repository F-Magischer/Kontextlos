<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7D6">
<title>KONTEXTLOS</title>
<style>
@font-face { font-family: "Brico"; src: url("fonts/BricolageGrotesque.ttf"); font-weight: 200 800; font-stretch: 75% 100%; }
@font-face { font-family: "Plex"; src: url("fonts/IBMPlexMono-Medium.ttf"); }
:root { --paper:#EFE7D6; --ink:#1B1A17; --pink:#FF4F79; --blue:#2B59C3; --yellow:#FFD23F; --white:#FFFDF7; --me:var(--pink); }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--paper); color: var(--ink); }
body {
  min-height: 100dvh; font-family: "Brico", system-ui, sans-serif; font-stretch: 85%;
  background-image: radial-gradient(rgba(27,26,23,.13) 1px, transparent 1.2px); background-size: 7px 7px; background-attachment: fixed;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
/* riso tape in the corners, like the big screen */
body::before, body::after { content: ""; position: fixed; width: 260px; height: 38px; transform: rotate(-24deg); z-index: -1; opacity: .9; }
body::before { background: var(--pink); left: -70px; bottom: 40px; }
body::after { background: var(--blue); right: -80px; top: 120px; }
.wrap { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 18px 40px; min-height: 100dvh; display: flex; flex-direction: column; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 3px solid var(--ink); padding-bottom: 10px; margin-bottom: 20px; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: -.02em; }
.logo span { background: var(--ink); color: var(--paper); padding: 0 5px; }
.who { display: flex; gap: 6px; align-items: center; font-family: "Plex", monospace; font-size: 12px; text-transform: uppercase; }
.who .code { border: 2px solid var(--ink); padding: 2px 6px; background: var(--yellow); }
.who b { background: var(--me); color: #fff; padding: 3px 7px; }
main { flex: 1; display: flex; flex-direction: column; }
.mono { font-family: "Plex", monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
h1 { font-weight: 800; font-size: clamp(40px, 12vw, 64px); line-height: .9; letter-spacing: -.035em; margin: 8px 0 14px; }
h2 { font-weight: 800; font-size: 28px; line-height: 1.02; letter-spacing: -.02em; margin: 6px 0 14px; }
p { font-size: 18px; line-height: 1.35; }
.sticker { display: inline-block; background: var(--pink); color: #fff; font-weight: 800; font-size: 24px; padding: 6px 12px; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); transform: rotate(2deg); }
.card { background: var(--white); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 16px; margin: 8px 0 22px; }
.prompt { background: var(--yellow); transform: rotate(-1.2deg); }
.prompt .q { font-size: 28px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin-top: 6px; }
label { display: block; margin-bottom: 6px; }
input, textarea {
  width: 100%; font: 600 21px "Brico", system-ui, sans-serif; color: var(--ink);
  border: 3px solid var(--ink); background: var(--white); padding: 12px; border-radius: 0; outline: none;
}
input:focus, textarea:focus { box-shadow: 5px 5px 0 var(--me); }
textarea { min-height: 120px; resize: none; }
input#code { text-transform: uppercase; letter-spacing: .3em; font-family: "Plex", monospace; }
.field { margin-bottom: 16px; }
.count { text-align: right; margin: -8px 0 8px; }
button, .btn {
  display: block; width: 100%; text-align: center; text-decoration: none; font: 800 23px "Brico", system-ui, sans-serif; letter-spacing: -.01em;
  background: var(--ink); color: var(--paper); border: 3px solid var(--ink); padding: 16px;
  box-shadow: 5px 5px 0 var(--me); cursor: pointer; border-radius: 0; margin-top: 8px; transition: transform .06s, box-shadow .06s;
}
button:active, .btn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--me); }
button:disabled { opacity: .35; }
.ghost { background: var(--white); color: var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.small { font-size: 17px; padding: 11px; }
.or { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; } .or::before, .or::after { content: ""; flex: 1; border-top: 2px dashed var(--ink); }
.err { background: var(--pink); color: #fff; padding: 10px 12px; margin-bottom: 14px; font-weight: 700; border: 3px solid var(--ink); }
.timer { position: relative; height: 12px; background: rgba(27,26,23,.12); margin: 22px 0 18px; }
.timer i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; }
.timer span { position: absolute; right: 0; top: -20px; font: 13px "Plex", monospace; }
.bigcode { font: 64px/1 "Plex", monospace; letter-spacing: .12em; background: var(--yellow); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 10px 14px; display: inline-block; transform: rotate(-2deg); margin: 6px 0 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 22px; }
.chip { color: #fff; font-weight: 800; font-size: 19px; padding: 6px 12px; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.chip small { font: 10px "Plex", monospace; display: block; opacity: .85; text-transform: uppercase; }
.wait { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 18px; padding-bottom: 60px; }
.wait .sticker { font-size: clamp(34px, 10vw, 54px); padding: 12px 18px; background: var(--me); animation: wobble 3s ease-in-out infinite; }
.dots span { display: inline-block; width: 12px; height: 12px; background: var(--ink); margin-right: 8px; animation: bounce 1s infinite; }
.dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 2px solid var(--ink); font-weight: 800; font-size: 20px; }
.row:last-child { border-bottom: 0; }
.row { display: grid; grid-template-columns: 22px 1fr 56px 52px; row-gap: 4px; }
.row .track { grid-column: 2 / 5; grid-row: 2; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .track { height: 16px; }
.row .sbar { display: block; height: 100%; border: 2px solid var(--ink); transform-origin: left; animation: grow .8s cubic-bezier(.2,.9,.2,1) both; }
.mrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px dashed rgba(27,26,23,.25); }
.mrow b, .mrow s { flex: 1; font-size: 19px; }
.tiny { width: auto; margin: 0; padding: 6px 10px; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); }
.sticker.win { display: block; width: fit-content; margin: 2px 0 6px; font-size: 18px; background: var(--yellow); color: var(--ink); }
.row .pts { font-family: "Plex", monospace; font-size: 16px; min-width: 46px; text-align: right; }
.row .gain { color: var(--pink); font-family: "Plex", monospace; font-size: 13px; min-width: 48px; text-align: right; }
.stamp { display: inline-block; background: var(--ink); color: var(--paper); font-weight: 800; font-size: 18px; padding: 4px 10px; transform: rotate(-3deg); margin-bottom: -4px; position: relative; z-index: 1; }
.stamp.top { background: var(--pink); color: #fff; }
.place { font-weight: 800; font-size: 120px; line-height: .9; letter-spacing: -.05em; }
.opt { display: block; width: 100%; padding: 0; background: none; border: 0; box-shadow: none; margin: 0 0 22px; text-align: left; color: var(--ink); font: inherit; }
.opt:active { transform: scale(.98); box-shadow: none; }
.optxt { display: block; text-align: left; font: 700 19px/1.25 "Brico", system-ui, sans-serif; background: var(--white); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); margin: 0 0 14px; }
.optxt small { display: block; font: 12px "Plex", monospace; text-transform: uppercase; margin-bottom: 4px; color: var(--blue); }

/* animation */
@keyframes slap { from { transform: scale(1.3) rotate(var(--r, -1deg)); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1) rotate(var(--r, -1deg)); opacity: 1; } }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wobble { 0%, 100% { transform: rotate(2deg); } 50% { transform: rotate(-2deg) scale(1.03); } }
@keyframes bounce { 0%, 100% { transform: none; } 40% { transform: translateY(-8px); } }
@keyframes grow { from { transform: scaleX(0); } }
.in > * { animation: drop .35s cubic-bezier(.2,.9,.2,1) both; }
.in > *:nth-child(2) { animation-delay: .05s; } .in > *:nth-child(3) { animation-delay: .1s; } .in > *:nth-child(4) { animation-delay: .15s; }
.in > *:nth-child(5) { animation-delay: .2s; } .in > *:nth-child(n+6) { animation-delay: .25s; }
.slap { animation: slap .4s cubic-bezier(.2,1.4,.4,1) both !important; }

/* fake internet posts: same layouts as the big screen */
.post { --r: -1deg; background: var(--white); border: 3px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); margin: 6px 0 24px; transform: rotate(var(--r)); text-align: left; overflow: hidden; }
.post .pad { padding: 16px; }
.post .bar { background: var(--ink); color: var(--paper); padding: 8px 16px; font: 11px "Plex", monospace; text-transform: uppercase; letter-spacing: .08em; }
.post h3 { font-weight: 800; font-size: 29px; line-height: 1.02; letter-spacing: -.025em; margin: 4px 0 10px; }
.post .a { font-size: 23px; font-weight: 600; line-height: 1.2; }
.post .who { font: 800 17px "Brico", system-ui, sans-serif; display: block; margin-bottom: 2px; }
.post .lbl { font: 12px "Plex", monospace; text-transform: uppercase; letter-spacing: .06em; display: block; margin-bottom: 2px; opacity: .75; }
.post.stage1 .an { visibility: hidden; }
.post.stage2 .an { animation: drop .4s cubic-bezier(.2,.9,.2,1) both; }
.qa { padding: 12px 16px; border-top: 2px dashed rgba(27,26,23,.35); }
.bar + .qa { border-top: 0; }
.p-lastwords { color: var(--paper); }
.p-lastwords h3 { color: var(--yellow); }
.p-lastwords .a { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.chat { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.bub { border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 10px 12px; max-width: 86%; }
.bub.l { background: var(--white); align-self: flex-start; }
.bub.r { align-self: flex-end; color: #fff; }
.bub h3 { font-size: 25px; margin: 2px 0 0; }
.seg { display: flex; gap: 8px; margin: 4px 0 10px; }
.seg button { flex: 1; margin: 0; padding: 10px 0; font-size: 21px; background: var(--white); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 var(--me); }
textarea.slot {
  display: block; width: 100%; min-height: 0; padding: 6px 8px; resize: none; overflow: hidden; margin: 4px 0;
  font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; text-align: inherit;
  background: rgba(255,79,121,.14); border: 3px dashed var(--pink); box-shadow: none !important;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { background: rgba(255,79,121,.28); } }
textarea.slot:focus { animation: none; background: rgba(255,79,121,.08); }
textarea.slot::placeholder { color: inherit; opacity: .5; font-size: .62em; font-weight: 600; letter-spacing: 0; }
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><span>KONTEXT</span>LOS</div><div class="who" id="who"></div></header>
<main id="app"></main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const devId = () => { let d = store.get("kl_dev"); if (!d) { d = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("kl_dev", d); } return d; };
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let ws, me = null, last = null, sentKey = null, timerRAF = 0, endTimer = 0;

function connect(code, name, create = false) {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
  ws.onopen = () => ws.send(JSON.stringify(create ? { t: "create", name, dev: devId() } : { t: "join", code, name, dev: devId(), pid: store.get("kl_pid_" + code) }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "joined") {
      if (window.KL_BUILD && m.build !== window.KL_BUILD) return location.reload(); // new version deployed: load it
      window.KL_BUILD = m.build;
      me = m; store.set("kl_pid_" + m.code, m.id); store.set("kl_name", m.name); store.set("kl_code", m.code);
      history.replaceState(null, "", "?code=" + m.code);
      $("#who").innerHTML = `<span class="code">${esc(m.code)}</span><b>${esc(m.name)}</b>`;
    }
    else if (m.t === "error") { me = null; startScreen(m.msg); }
    else if (m.t === "msg") show(m.d);
  };
  ws.onclose = () => { if (me) setTimeout(() => connect(me.code, me.name), 1500); };
}
const out = (d) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: "msg", d }));
const screenHost = (code) => "host/" + (code ? "?code=" + encodeURIComponent(code) : "");

// One page for everyone: join, start a new room, or turn this device into the big screen.
function startScreen(err) {
  last = null;
  const code0 = new URLSearchParams(location.search).get("code") || "";
  app.className = "in";
  app.innerHTML = `
    ${err ? `<div class="err">${esc(err)}</div>` : ""}
    <h1>Sag was<br>Harmloses.</h1>
    <div><span class="sticker">Wir machen's schlimm.</span></div>
    <div class="field" style="margin-top:28px"><label class="mono" for="name">Dein Name</label><input id="name" maxlength="12" autocomplete="nickname" value="${esc(store.get("kl_name") || "")}"></div>
    <div class="field"><label class="mono" for="code">Raumcode</label><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(code0)}"></div>
    <button id="go">Mitspielen</button>
    <div class="or mono">oder</div>
    <button id="new" class="ghost">Neuen Raum erstellen</button>
    <a class="btn ghost small" id="screen" href="${screenHost(code0)}">Als großen Bildschirm öffnen (TV / Beamer)</a>`;
  const codeIn = $("#code");
  codeIn.oninput = () => { $("#screen").href = screenHost(codeIn.value.trim().toUpperCase()); };
  $("#go").onclick = () => {
    const code = codeIn.value.trim().toUpperCase(), name = $("#name").value.trim();
    if (!name) return startScreen("Erst deinen Namen eingeben.");
    if (code.length !== 4) return startScreen("Der Raumcode hat 4 Buchstaben. Neuer Raum? Dann unten erstellen.");
    $("#go").disabled = true;
    connect(code, name);
  };
  $("#new").onclick = () => {
    const name = $("#name").value.trim();
    if (!name) return startScreen("Erst deinen Namen eingeben.");
    $("#new").disabled = true;
    connect("", name, true);
  };
}

// Timer bar + a hard end callback (setTimeout keeps working when rAF is paused).
function timer(sec, onEnd) {
  cancelAnimationFrame(timerRAF); clearTimeout(endTimer);
  const bar = $(".timer i"), num = $(".timer span"); if (!sec) return;
  const end = performance.now() + sec * 1000, total = sec * 1000;
  const tick = () => {
    const left = Math.max(0, end - performance.now());
    if (bar) bar.style.transform = `scaleX(${left / total})`;
    if (num) num.textContent = Math.ceil(left / 1000) + " s";
    if (left > 0) timerRAF = requestAnimationFrame(tick);
  };
  tick();
  if (onEnd) endTimer = setTimeout(onEnd, sec * 1000);
}
const timerHTML = `<div class="timer"><i></i><span></span></div>`;

// One fake internet post. edit=true turns the twist into a text field right where it will appear.
function post(p, { edit = false, stage = 2, placeholder = "", max = 70, r = -1 } = {}) {
  const tw = edit ? `<textarea class="slot" id="txt" rows="1" maxlength="${max}" placeholder="${esc(placeholder)}"></textarea>` : esc(p.twist);
  const a = esc(p.answer), who = esc(p.who), col = esc(p.color);
  const name = `<span class="who" style="color:${col}">${who}</span>`;
  const fc = esc(p.fcolor), cap = (x) => esc(String(x || "").replace(/^./, (c) => c.toUpperCase()));
  const body = p.kind === "chat"
    ? `<div class="bar" style="background:${fc};color:#fff">${esc(p.head)}</div>
      <div class="chat"><div class="bub l"><span class="lbl">${esc(p.qLabel)}</span><h3>${tw}</h3></div>
      <div class="bub r an" style="background:${col}"><p class="a">${a}</p><span class="lbl">${who} · gelesen</span></div></div>`
    : p.kind === "lastwords"
    ? `<div class="bar" style="background:${fc};color:#fff">${esc(p.head)}</div><div class="pad">
      <span class="lbl" style="opacity:.85">Die letzten Worte von ${who}, kurz bevor</span><h3>${tw}</h3>
      <p class="a an">„${a}“</p></div>`
    : `<div class="bar" style="background:${fc};color:#fff">${esc(p.head)}</div>
      <div class="qa"><span class="lbl">${esc(p.qLabel)}</span><h3>${tw}</h3></div>
      <div class="qa an"><span class="lbl">${esc(p.aRole)}</span>${name}<p class="a">„${a}“</p></div>`;
  const origin = stage >= 3 && p.prompt ? `<div class="card prompt slap" style="--r:1.2deg"><span class="mono">Eigentlich gefragt war ${who}:</span><div class="q">${esc(p.prompt)}</div></div>` : "";
  return `<div class="post p-${esc(p.kind)} stage${stage}" style="--r:${r}deg;background:${esc(p.fbg)}">${body}</div>${origin}`;
}

function waitScreen(title, text) { show({ s: "wait", title, text }); }
const tilt = (i) => [-1.4, 1.1, -0.7, 1.6, -1.8, 0.8][i % 6];

function show(d) {
  // ignore duplicate state resends so typing isn't wiped
  const sig = JSON.stringify(d);
  if (sig === last) return;
  const prev = last ? JSON.parse(last) : {};
  last = sig;
  cancelAnimationFrame(timerRAF); clearTimeout(endTimer);
  if (d.color) document.documentElement.style.setProperty("--me", d.color);
  app.className = "in";

  if (d.s === "lobby") {
    const can = d.count >= d.min;
    const known = prev.s === "lobby" ? new Set((prev.players || []).map((p) => p.name)) : new Set();
    const chips = d.players.map((p, i) => `<span class="chip ${known.has(p.name) ? "" : "slap"}" style="background:${esc(p.color)};--r:${tilt(i)}deg;transform:rotate(${tilt(i)}deg)"><small>${p.vip ? "Boss" : "dabei"}</small>${esc(p.name)}</span>`).join("");
    if (prev.s === "lobby") app.className = ""; // only new chips animate
    app.innerHTML = `<p class="mono">Raumcode</p><div><span class="bigcode">${esc(d.code)}</span></div>
      <p class="mono">${d.count} von max. ${d.max} dabei · ${d.phoneMode ? "Auflösung auf allen Handys" : "Auflösung auf dem großen Bildschirm"}</p>
      <div class="chips">${chips}</div>
      ${d.vip ? `<button id="start" ${can ? "" : "disabled"}>${can ? "Alle da — los!" : `Noch ${d.min - d.count} fehlt`}</button>
        <div class="or mono">Einstellungen</div>
        <p class="mono">Runden</p>
        <div class="seg">${d.roundChoices.map((n) => `<button data-rounds="${n}" class="${n === d.rounds ? "on" : ""}">${n}</button>`).join("")}</div>
        <button id="same" class="ghost small">Vorlagen: ${d.sameFormat ? "jede Runde gleich für alle" : "gemischt"}</button>
        <button id="origin" class="ghost small">Original-Frage zeigen: ${d.showOrigin ? "an" : "aus"}</button>`
        : `<p class="mono">${d.rounds} Runden · Vorlagen ${d.sameFormat ? "gleich für alle" : "gemischt"}</p><div class="card"><p>Gleich geht's los. <b>${esc(d.players.find((p) => p.vip)?.name || "Der Boss")}</b> startet das Spiel.</p></div>`}
      ${d.vip && (d.players.length > 1 || d.banned.length) ? `<div class="or mono">Spieler verwalten</div>
        ${d.players.filter((p) => p.id !== d.you).map((p) => `<div class="mrow"><b style="color:${esc(p.color)}">${esc(p.name)}</b>
          <button class="ghost tiny" data-kick="${esc(p.id)}">Kicken</button><button class="tiny" data-ban="${esc(p.id)}">Bannen</button></div>`).join("")}
        ${d.banned.map((b) => `<div class="mrow"><s>${esc(b.name)}</s><span class="mono">gebannt</span><button class="ghost tiny" data-unban="${esc(b.dev)}">Entbannen</button></div>`).join("")}` : ""}
      <div class="or mono">Leute einladen</div>
      <button id="share" class="ghost small">Link teilen</button>
      ${d.hasHost ? "" : `<a class="btn ghost small" href="${screenHost(d.code)}" target="_blank">Großen Bildschirm dazuschalten</a>`}`;
    if (d.vip) {
      $("#start").onclick = () => out({ a: "start" });
      $("#same").onclick = () => out({ a: "set", key: "sameFormat", value: !d.sameFormat });
      $("#origin").onclick = () => out({ a: "set", key: "showOrigin", value: !d.showOrigin });
      app.querySelectorAll("[data-kick]").forEach((b) => b.onclick = () => out({ a: "kick", id: b.dataset.kick }));
      app.querySelectorAll("[data-ban]").forEach((b) => b.onclick = () => { if (confirm("Wirklich bannen? Die Person kommt nicht mehr in diesen Raum.")) out({ a: "ban", id: b.dataset.ban }); });
      app.querySelectorAll("[data-unban]").forEach((b) => b.onclick = () => out({ a: "unban", dev: b.dataset.unban }));
      app.querySelectorAll("[data-rounds]").forEach((b) => b.onclick = () => out({ a: "set", key: "rounds", value: Number(b.dataset.rounds) }));
    }
    $("#share").onclick = async () => {
      try { if (navigator.share) await navigator.share({ title: "KONTEXTLOS", text: "Spiel mit! Raumcode " + d.code, url: d.link }); else { await navigator.clipboard.writeText(d.link); $("#share").textContent = "Link kopiert!"; } }
      catch (e) { if (e.name !== "AbortError") $("#share").textContent = d.link; } // share/clipboard need https
    };

  } else if (d.s === "write") {
    if (sentKey === d.key) return waitScreen("Abgeschickt.", "Warte auf die anderen …");
    const max = d.max || 80;
    app.innerHTML = d.post
      ? `<p class="mono">${esc(d.tag)}</p><h2>${d.qword ? "Stell die Frage, auf die diese Antwort passt." : "Wie geht der Satz weiter?"}</h2>
         ${d.qword ? `<div class="card prompt" style="--r:.8deg;padding:10px 14px;margin:0 0 6px"><span class="mono">Tipp</span>
           <p style="font-weight:700">Die Antwort passt auf eine <b>${esc(d.qword)}</b>-Frage. Der Anfang steht schon drin.</p>${d.qhint ? `<p style="font-size:15px;margin-top:4px">${esc(d.qhint)}</p>` : ""}</div>` : ""}
         ${timerHTML}
         <div class="slap">${post(d.post, { edit: true, placeholder: d.placeholder, max })}</div>
         <div class="count mono" id="cnt">0/${max}</div><button id="send">Abschicken</button>`
      : `<p class="mono">${esc(d.tag)}</p>${timerHTML}
         <div class="card prompt slap" style="--r:-1.2deg"><span class="mono">${esc(d.label || "Ehrliche Frage")}</span><div class="q">${esc(d.title)}</div></div>
         <div class="field"><textarea id="txt" maxlength="${max}" placeholder="${esc(d.placeholder || "")}"></textarea></div>
         <div class="count mono" id="cnt">0/${max}</div><button id="send">Abschicken</button>`;
    const t = $("#txt");
    const grow = () => { if (d.post) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } };
    t.oninput = () => { $("#cnt").textContent = `${t.value.length}/${max}`; grow(); };
    if (d.post && d.qword) t.value = d.qword + " "; // start the question with the matching question word
    t.oninput();
    const submit = () => { sentKey = d.key; out({ a: "submit", key: d.key, text: t.value.trim() }); waitScreen("Abgeschickt.", "Warte auf die anderen …"); };
    t.onfocus = () => { const n = t.value.length; t.setSelectionRange(n, n); };
    $("#send").onclick = () => { if (!t.value.trim() || t.value.trim() === d.qword) return t.focus(); submit(); };
    // time's up: send whatever is typed (the game fills in a fallback if it's empty)
    timer(d.seconds, () => { if (sentKey !== d.key) { t.blur(); submit(); waitScreen("Zeit um!", "Dein Text wurde abgeschickt."); } });

  } else if (d.s === "vote") {
    if (sentKey === d.key) return waitScreen("Stimme gezählt.", "Mal sehen, wer gewinnt …");
    app.innerHTML = `<p class="mono">Abstimmung</p><h2>${esc(d.title)}</h2>${timerHTML}` +
      d.options.map((o, i) => d.full && o.post
        ? `<button class="opt" data-i="${o.i}">${post(o.post, { r: tilt(i) })}</button>`
        : `<button class="optxt" data-i="${o.i}"><small>${esc(o.tag)}</small>${esc(o.text)}</button>`).join("");
    app.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => { sentKey = d.key; out({ a: "vote", key: d.key, i: Number(b.dataset.i) }); waitScreen("Stimme gezählt.", "Mal sehen, wer gewinnt …"); });
    timer(d.seconds);

  } else if (d.s === "reveal") {
    const same = prev.s === "reveal" && prev.tag === d.tag; // stage change: keep the card still, let the answer drop in
    if (same) app.className = "";
    app.innerHTML = `<p class="mono">${esc(d.tag)}</p><div class="${same ? "" : "slap"}" style="margin-top:14px">${post(d.post, { stage: d.stage })}</div>`;

  } else if (d.s === "results") {
    const top = Math.max(...d.items.map((it) => it.votes));
    const items = [...d.items].sort((a, b) => b.votes - a.votes);
    app.innerHTML = `<p class="mono">Auszählung</p><h1>Wer war das?</h1>` + items.map((it, i) =>
      `<div><span class="stamp ${it.votes === top && top > 0 ? "top" : ""}">${it.votes} ${it.votes === 1 ? "Stimme" : "Stimmen"} · verdreht von ${esc(it.post.twister)}</span>${i === 0 && top > 0 ? `<span class="sticker win">Bester Post der Runde</span>` : ""}${post(it.post, { r: tilt(i) })}</div>`).join("");

  } else if (d.s === "scores") {
    const best = Math.max(1, ...d.rows.map((r) => r.score));
    app.innerHTML = `<p class="mono">Punktestand</p><h1>${esc(d.title)}</h1>
      ${d.gain > 0 ? `<div><span class="sticker">+${d.gain} für dich</span></div>` : ""}
      <div class="card" style="margin-top:22px">${d.rows.map((r, i) => `<div class="row"><span class="mono">${i + 1}</span><span class="nm">${esc(r.name)}</span>
        <span class="track"><span class="sbar" style="background:${esc(r.color)};width:${Math.max(2, 100 * r.score / best)}%;animation-delay:${.1 + i * .05}s"></span></span>
        <span class="pts">${r.score}</span><span class="gain">${r.gain > 0 ? "+" + r.gain : ""}</span></div>`).join("")}</div>`;

  } else if (d.s === "end") {
    app.innerHTML = `<div class="wait"><p class="mono">Ende</p><div class="place slap">#${d.place}</div>
      <span class="sticker">${d.place === 1 ? "Du gewinnst!" : esc(d.text)}</span>
      ${d.place === 1 ? `<p>${esc(d.text)}</p>` : ""}
      ${d.vip ? `<button id="again" style="margin-top:20px">Nochmal spielen</button>` : ""}</div>`;
    if (d.vip) $("#again").onclick = () => out({ a: "restart" });

  } else {
    app.innerHTML = `<div class="wait"><div class="slap"><span class="sticker">${esc(d.title || "Augen nach vorn.")}</span></div>
      <p>${esc(d.text || "")}</p><div class="dots"><span></span><span></span><span></span></div></div>`;
  }
}

startScreen();
const q0 = new URLSearchParams(location.search).get("code");
if (q0 && store.get("kl_pid_" + q0.toUpperCase())) connect(q0.toUpperCase(), store.get("kl_name") || "");
</script>
</body>
</html>
