# Render blueprint: two always-on Node web services (WebSockets + static files).
# Players reach both through Cloudflare Workers (cloudflare/proxy.js): kontextlos.furida.workers.dev and play.furida.workers.dev.
services:
  - type: web
    name: kontextlos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /
    buildFilter:
      paths: ["server/**"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_URL
        value: https://kontextlos.furida.workers.dev
      - key: PARTY_KEY # same value as KONTEXTLOS_KEY on furida-party
        sync: false

  # FURIDA party service + hub (platform/)
  - type: web
    name: furida-party
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd platform && npm ci
    startCommand: cd platform && npm start
    healthCheckPath: /health
    buildFilter:
      paths: ["platform/**"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: KONTEXTLOS_KEY
        sync: false
