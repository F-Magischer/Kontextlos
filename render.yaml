# Render blueprint: one always-on Node web service (WebSockets + static files).
services:
  - type: web
    name: kontextlos
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: PUBLIC_URL
        value: https://finn.lnny.dev
      - key: NODE_VERSION
        value: "22"
    domains:
      - finn.lnny.dev
