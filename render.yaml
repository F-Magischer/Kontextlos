# Render blueprint: one always-on Node web service (WebSockets + static files).
# The public address comes from RENDER_EXTERNAL_URL; set PUBLIC_URL only for a custom domain.
services:
  - type: web
    name: kontextlos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
