<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7D6">
<title>FURIDA</title>
<style>
@font-face { font-family: "Brico"; src: url("/fonts/BricolageGrotesque.ttf"); font-weight: 200 800; font-stretch: 75% 100%; font-display: swap; }
:root { --paper:#EFE7D6; --ink:#1B1A17; --pink:#FF4F79; --blue:#2B59C3; --yellow:#FFD23F; --white:#FFFDF7; }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--paper); color: var(--ink); }
body { min-height: 100dvh; font-family: "Brico", system-ui, sans-serif; font-stretch: 85%;
  background-image: radial-gradient(rgba(27,26,23,.13) 1px, transparent 1.2px); background-size: 7px 7px; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 40px; }
header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--ink); padding-bottom: 10px; margin-bottom: 20px; }
.logo { font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
.logo span { background: var(--ink); color: var(--paper); padding: 1px 7px; box-shadow: 3px 3px 0 var(--pink); }
h1 { font-weight: 800; font-size: clamp(38px, 11vw, 58px); line-height: .92; letter-spacing: -.035em; margin: 6px 0 16px; }
h2 { font-weight: 800; font-size: 22px; letter-spacing: -.02em; margin: 22px 0 10px; }
p { font-size: 17px; line-height: 1.35; }
.label { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 6px; }
input { width: 100%; font: 600 20px "Brico", system-ui, sans-serif; color: var(--ink); border: 3px solid var(--ink); background: var(--white); padding: 11px; border-radius: 0; outline: none; }
input:focus { box-shadow: 5px 5px 0 var(--pink); }
input.code { text-transform: uppercase; letter-spacing: .3em; }
button { display: block; width: 100%; font: 800 20px "Brico", system-ui, sans-serif; background: var(--ink); color: var(--paper); border: 3px solid var(--ink);
  padding: 13px; box-shadow: 5px 5px 0 var(--pink); cursor: pointer; border-radius: 0; margin-top: 10px; text-align: center; }
button:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--pink); }
button:disabled { opacity: .35; cursor: default; }
button.ghost { background: var(--white); color: var(--ink); box-shadow: 5px 5px 0 var(--ink); }
button.small { font-size: 15px; padding: 8px 10px; width: auto; display: inline-block; margin: 0; box-shadow: 3px 3px 0 var(--ink); }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { flex: 1; }
.card { background: var(--white); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 14px; margin: 8px 0 18px; }
.code-big { font-size: 44px; font-weight: 800; letter-spacing: .12em; }
.note { background: var(--yellow); border: 3px solid var(--ink); padding: 10px 12px; margin-bottom: 14px; font-weight: 600; }
.members { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.members li { border: 2px solid var(--ink); background: var(--white); padding: 4px 8px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.members li.off { opacity: .4; }
.members li .x { border: 0; background: none; color: var(--ink); font: 800 16px sans-serif; padding: 0 2px; cursor: pointer; width: auto; margin: 0; box-shadow: none; }
.crown { background: var(--yellow); padding: 0 4px; font-size: 12px; }
.game { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.game b { font-size: 20px; } .game small { display: block; font-size: 14px; }
.opt { position: relative; text-align: left; display: flex; justify-content: space-between; background: var(--white); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); overflow: hidden; }
.opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--yellow); z-index: 0; transition: width .3s; }
.opt span { position: relative; z-index: 1; }
.opt.mine { box-shadow: 4px 4px 0 var(--pink); outline: 3px solid var(--pink); }
.muted { opacity: .7; font-size: 15px; }
.settings { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.settings button.on { background: var(--blue); color: #fff; }

/* in-game overlay: a pill bottom-left, a sheet when open */
html.ov, html.ov body { background: transparent; background-image: none; min-height: 0; }
.ov .wrap { padding: 0; max-width: none; }
.pill { white-space: nowrap; position: fixed; left: 8px; bottom: 8px; width: auto; margin: 0; font-size: 15px; padding: 8px 12px; box-shadow: 3px 3px 0 var(--pink); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 100%; overflow: auto; background: var(--paper); border-top: 3px solid var(--ink); padding: 12px 14px 16px; }
.sheet .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.sheet h2 { margin-top: 12px; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const OV = location.pathname === "/overlay";
const PARENT = OV && document.referrer ? new URL(document.referrer).origin : null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const inviteCode = (location.pathname.match(/^\/p\/([A-Za-z]{4})$/) || [])[1]?.toUpperCase() || null;
const HOW = { leader: "Gleichstand – der Leader entscheidet.", lot: "Gleichstand – per Los.", "tie-stay": "Gleichstand – ihr bleibt.", none: "Keine Stimmen – ihr bleibt." };
let st = null, ws, note = "", renaming = false, openSheet = false, asked = false, autoJoined = false, voteEnds = 0, lastSize = "";
if (OV) document.documentElement.classList.add("ov");

const out = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const gameOf = (id) => st.games.find((g) => g.id === id);
const optName = (o) => o === "stay" ? `Weiterspielen (${gameOf(st.party.game)?.name || "hier"})` : (gameOf(o)?.name || o) + (o === st.party?.game ? " – neuer Raum" : "");
const toParent = (m) => PARENT && parent.postMessage(m, PARENT);
const navigate = (url) => OV ? toParent({ party: "go", url }) : (location.href = url);

async function start() {
  try { await fetch("/api/me", { credentials: "same-origin" }); } catch {}
  connect();
}
function connect() {
  ws = new WebSocket(location.origin.replace(/^http/, "ws"));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "state") { st = m; if (m.party?.vote) voteEnds = Date.now() + m.party.vote.left; afterState(); }
    else if (m.t === "note") { note = m.msg; render(); }
    else if (m.t === "go") navigate(m.url);
    else if (m.t === "code") toParent({ party: "code", code: m.code });
  };
  ws.onclose = (e) => setTimeout(e.code === 4001 ? start : connect, 2000);
}

function afterState() {
  const pa = st.party;
  if (!OV && inviteCode && st.me.name && !autoJoined && pa?.code !== inviteCode) { autoJoined = true; out({ t: "join", code: inviteCode }); }
  if (OV && pa?.game && !pa.busy && !asked && gameOf(pa.game) && new URL(gameOf(pa.game).url).origin === PARENT) { asked = true; out({ t: "code" }); }
  if (OV && pa?.vote) openSheet = true;
  render();
}

// ---------------------------------------------------------------- views
function partyBody() {
  const pa = st.party, lead = pa.leader === st.me.id;
  const busy = pa.busy && gameOf(pa.busy);
  let h = "";
  if (busy) h += `<div class="note">Wechsel zu ${esc(busy.name)} … (ein schlafender Server braucht bis zu einer Minute)</div>`;
  if (pa.last && !pa.vote) h += `<p class="muted">Ergebnis: <b>${esc(optName(pa.last.winner || "stay"))}</b>. ${HOW[pa.last.how] || ""}</p>`;
  h += `<ul class="members">${pa.members.map((m) => `<li class="${m.online ? "" : "off"}">${m.id === pa.leader ? `<span class="crown">LEAD</span>` : ""}${esc(m.name)}${m.id === st.me.id ? " (du)" : ""}
    ${lead && m.id !== st.me.id ? `<button class="x" data-kick="${esc(m.id)}" aria-label="${esc(m.name)} entfernen">×</button>` : ""}</li>`).join("")}</ul>`;
  if (pa.vote) {
    const total = Object.values(pa.vote.counts).reduce((a, b) => a + b, 0) || 1;
    h += `<h2>Was spielen wir als Nächstes? <span id="left"></span></h2>` + pa.vote.options.map((o) => `
      <button class="opt ${pa.vote.mine === o ? "mine" : ""}" data-vote="${esc(o)}"><i class="bar" style="width:${(pa.vote.counts[o] / total) * 100}%"></i>
      <span>${esc(optName(o))}</span><span>${pa.vote.counts[o]}</span></button>`).join("");
    if (lead) h += `<button class="ghost small" id="cancel" style="margin-top:14px">Abstimmung abbrechen</button>`;
  } else if (!busy) {
    const here = pa.game && gameOf(pa.game);
    const elsewhere = here && (OV ? new URL(here.url).origin !== PARENT : true);
    if (elsewhere) h += `<div class="card game"><div><small>Deine Party spielt gerade</small><b>${esc(here.name)}</b></div><button class="small" id="follow">Hin</button></div>`;
    if (lead || pa.anyone) h += `<button id="vote">Nächstes Spiel abstimmen</button>`;
    if (lead) {
      h += `<h2>${pa.game ? "Oder direkt wechseln" : "Spiel wählen"}</h2>` + st.games.map((g) => `
        <div class="card game"><div><b>${esc(g.name)}</b><small>${esc(g.tag)}${g.down ? " · gerade nicht erreichbar" : ""}</small></div>
        <button class="small" data-pick="${esc(g.id)}" ${pa.members.length > g.max ? "disabled" : ""}>Los</button></div>`).join("");
      h += `<div class="settings"><button class="small ghost ${pa.anyone ? "on" : ""}" id="anyone">Alle dürfen abstimmen lassen</button>
        ${[20, 30, 60].map((s) => `<button class="small ghost ${pa.secs === s ? "on" : ""}" data-secs="${s}">${s} s</button>`).join("")}</div>`;
    } else if (!pa.game) h += `<p class="muted" style="margin-top:14px">Warte, bis der Leader ein Spiel wählt.</p>`;
  }
  return h;
}

function render() {
  const n = note ? `<div class="note">${esc(note)}</div>` : "";
  if (OV) return renderOverlay(n);
  if (!st) { $("#app").innerHTML = `<header><div class="logo"><span>FURIDA</span></div></header><p>Verbinde …</p>`; return; }
  const pa = st.party;
  let h = `<header><div class="logo"><span>FURIDA</span></div>${st.me.name ? `<button class="small ghost" id="rename">${esc(st.me.name)} ✎</button>` : ""}</header>` + n;
  if (!st.me.name || renaming) {
    h += `<h1>Party-Spiele.<br>Zusammen.</h1><label class="label" for="name">Dein Name</label>
      <input id="name" maxlength="12" autocomplete="nickname" value="${esc(st.me.name || store.get("kl_name") || "")}"><button id="saveName">Weiter</button>`;
  } else if (!pa) {
    h += `<h1>Party-Spiele.<br>Zusammen.</h1><p>Eine Party bleibt zusammen – auch wenn ihr das Spiel wechselt.</p>
      <button id="create">Party erstellen</button>
      <h2>Oder beitreten</h2><div class="row"><input id="code" class="code" maxlength="4" placeholder="CODE" value="${esc(inviteCode || "")}"><button id="join" style="margin:0">Beitreten</button></div>`;
  } else {
    h += `<div class="card"><span class="label">Party-Code</span><div class="row"><div class="code-big">${esc(pa.code)}</div><button class="small" id="share">Einladen</button></div></div>`
      + partyBody() + `<button class="ghost" id="leave" style="margin-top:26px">Party verlassen</button>`;
  }
  $("#app").innerHTML = h;
  bind();
}

function renderOverlay(n) {
  const pa = st && st.party;
  let h = "";
  if (pa && openSheet) h = `<div class="sheet"><div class="top"><b>Party ${esc(pa.code)} · ${pa.members.length}</b><button class="small ghost" id="close">Zu</button></div>${n}${partyBody()}
    <div class="row" style="margin-top:14px"><button class="small ghost" id="hub">Zum Hub</button><button class="small ghost" id="leave">Verlassen</button></div></div>`;
  else if (pa) h = `<button class="pill" id="open">Party ${esc(pa.code)} · ${pa.members.filter((m) => m.online).length}${pa.game && gameOf(pa.game) && new URL(gameOf(pa.game).url).origin !== PARENT ? " · woanders!" : ""}</button>`;
  $("#app").innerHTML = h;
  bind();
  // tell the game page how much room the overlay needs
  const size = !pa ? "0,0" : openSheet ? `640,${Math.min(560, $(".sheet").scrollHeight + 4)}` : `${$(".pill").offsetWidth + 20},${$(".pill").offsetHeight + 20}`;
  if (size !== lastSize) { lastSize = size; const [w, h2] = size.split(","); toParent({ party: "size", w: +w, h: +h2 }); }
}

function bind() {
  const on = (sel, f) => { const el = $(sel); if (el) el.onclick = f; };
  on("#saveName", () => { const v = $("#name").value; store.set("kl_name", v); renaming = false; note = ""; out({ t: "name", name: v }); });
  on("#rename", () => { renaming = true; render(); });
  on("#create", () => { note = ""; out({ t: "create" }); });
  on("#join", () => { note = ""; out({ t: "join", code: $("#code").value }); });
  on("#leave", () => { note = ""; openSheet = false; out({ t: "leave" }); });
  on("#vote", () => { note = ""; out({ t: "vote-start" }); });
  on("#cancel", () => out({ t: "vote-cancel" }));
  on("#anyone", () => out({ t: "settings", anyone: !st.party.anyone, secs: st.party.secs }));
  on("#follow", () => navigate(gameOf(st.party.game).url));
  on("#open", () => { openSheet = true; render(); });
  on("#close", () => { openSheet = false; note = ""; render(); });
  on("#hub", () => navigate(location.origin + "/"));
  on("#share", async () => {
    const url = `${location.origin}/p/${st.party.code}`;
    try { if (navigator.share) await navigator.share({ title: "FURIDA-Party", url }); else { await navigator.clipboard.writeText(url); note = "Link kopiert."; render(); } } catch {}
  });
  document.querySelectorAll("[data-kick]").forEach((b) => b.onclick = () => out({ t: "kick", id: b.dataset.kick }));
  document.querySelectorAll("[data-vote]").forEach((b) => b.onclick = () => out({ t: "vote", option: b.dataset.vote }));
  document.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => { note = ""; out({ t: "pick", game: b.dataset.pick }); });
  document.querySelectorAll("[data-secs]").forEach((b) => b.onclick = () => out({ t: "settings", anyone: st.party.anyone, secs: +b.dataset.secs }));
  const name = $("#name");
  if (name) name.onkeydown = (e) => e.key === "Enter" && $("#saveName").click();
}

setInterval(() => { const el = $("#left"); if (el) el.textContent = Math.max(0, Math.ceil((voteEnds - Date.now()) / 1000)) + " s"; }, 250);
render();
start();
</script>
</body>
</html>
