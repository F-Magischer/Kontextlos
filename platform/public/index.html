<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE7D6">
<title>FURIDA</title>
<link rel="preload" href="/fonts/BricolageGrotesque.ttf" as="font" type="font/ttf" crossorigin>
<style>
/* same look as the KONTEXTLOS phone page: riso zine, paper, tapes, hard shadows */
@font-face { font-family: "Brico"; src: url("/fonts/BricolageGrotesque.ttf"); font-weight: 200 800; font-stretch: 75% 100%; font-display: block; }
@font-face { font-family: "Plex"; src: url("/fonts/IBMPlexMono-Medium.ttf"); font-display: block; }
:root { --paper:#EFE7D6; --ink:#1B1A17; --pink:#FF4F79; --blue:#2B59C3; --yellow:#FFD23F; --white:#FFFDF7; --me:var(--pink); }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--paper); color: var(--ink); }
body {
  min-height: 100dvh; font-family: "Brico", system-ui, sans-serif; font-stretch: 85%;
  background-image: radial-gradient(rgba(27,26,23,.13) 1px, transparent 1.2px); background-size: 7px 7px; background-attachment: fixed;
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
body::before, body::after { content: ""; position: fixed; width: 300px; height: 44px; transform: rotate(-24deg); z-index: 0; pointer-events: none; opacity: .92; }
body::before { background: var(--pink); left: -150px; bottom: 34px; }
body::after { background: var(--blue); right: -150px; bottom: 34px; }
.wrap { max-width: 560px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 18px 40px; min-height: 100dvh; display: flex; flex-direction: column; position: relative; z-index: 1; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 3px solid var(--ink); padding-bottom: 10px; margin-bottom: 20px; }
.logo { font-weight: 800; font-size: 26px; letter-spacing: -.02em; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; transition: transform .12s; }
.logo:hover { transform: rotate(-2deg) scale(1.04); }
.logo span { background: var(--ink); color: var(--paper); padding: 1px 7px; margin-right: 3px; box-shadow: 3px 3px 0 var(--pink); }
.who { display: flex; gap: 6px; align-items: center; font-size: 12px; text-transform: uppercase; }
.who .code { border: 2px solid var(--ink); padding: 2px 6px; background: var(--yellow); }
.who b { background: var(--me); color: #fff; padding: 3px 7px; }
main { flex: 1; display: flex; flex-direction: column; }
.mono { font-size: 14px; text-transform: uppercase; }
h1 { font-weight: 800; font-size: clamp(40px, 12vw, 64px); line-height: .9; letter-spacing: -.035em; margin: 8px 0 14px; }
h2 { font-weight: 800; font-size: 28px; line-height: 1.02; letter-spacing: -.02em; margin: 6px 0 14px; }
p { font-size: 18px; line-height: 1.35; }
.sticker { display: inline-block; background: var(--pink); color: #fff; font-weight: 800; font-size: 24px; padding: 6px 12px; border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); transform: rotate(2deg); }
.card { background: var(--white); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 16px; margin: 8px 0 22px; }
label { display: block; margin-bottom: 6px; }
input { width: 100%; font: 600 21px "Brico", system-ui, sans-serif; color: var(--ink); border: 3px solid var(--ink); background: var(--white); padding: 12px; border-radius: 0; outline: none; }
input:focus { box-shadow: 5px 5px 0 var(--me); }
input#code { text-transform: uppercase; letter-spacing: .3em; font-family: "Plex", monospace; }
.field { margin-bottom: 16px; }
button, .btn {
  display: block; width: 100%; text-align: center; text-decoration: none; font: 800 23px "Brico", system-ui, sans-serif; letter-spacing: -.01em;
  background: var(--ink); color: var(--paper); border: 3px solid var(--ink); padding: 16px;
  box-shadow: 5px 5px 0 var(--me); cursor: pointer; border-radius: 0; margin-top: 8px; transition: transform .06s, box-shadow .06s;
}
button:active, .btn:active { transform: translate(3px,3px); box-shadow: 2px 2px 0 var(--me); }
button:disabled { opacity: .35; }
.ghost { background: var(--white); color: var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.small { font-size: 17px; padding: 11px; }
.or { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; } .or::before, .or::after { content: ""; flex: 1; border-top: 2px dashed var(--ink); }
.err { background: var(--pink); color: #fff; padding: 10px 12px; margin-bottom: 14px; font-weight: 700; border: 3px solid var(--ink); }
.info { background: var(--yellow); padding: 10px 12px; margin-bottom: 14px; font-weight: 700; border: 3px solid var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
.tg { font: 700 14px "Brico", sans-serif; font-stretch: 78%; letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border: 2.5px solid var(--ink); background: var(--white); }
.tg.t0 { background: var(--ink); color: var(--paper); }
.tg.t2 { background: var(--yellow); }
.bigcode { font: 64px/1 "Plex", monospace; letter-spacing: .12em; background: var(--yellow); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 10px 14px; display: inline-block; transform: rotate(-2deg); margin: 6px 0 18px; }
.joinbox { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: var(--yellow); transform: rotate(-.8deg); padding: 14px; margin-top: 0; }
.joinbox .bigcode { display: inline-block; width: auto; font-size: 40px; padding: 8px 10px; margin: 6px 0 8px; background: var(--white); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; }
.joinbox .bigcode:active { transform: translate(3px,3px) rotate(-2deg); box-shadow: 1px 1px 0 var(--ink); }
#copied.ok { background: var(--ink); color: var(--paper); padding: 2px 6px; }
.joinbox > div:first-child { display: flex; flex-direction: column; align-items: flex-start; }
.joinbox .jr { display: flex; flex-direction: column; align-items: stretch; }
.joinbox .qr { width: 156px; height: 156px; display: block; border: 3px solid var(--ink); background: #fff; image-rendering: pixelated; }
.joinbox #share { margin-top: 10px; font-size: 16px; padding: 9px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts button { margin: 0; font-size: 16px; padding: 11px 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 22px; }
.chip { color: #fff; font-weight: 800; font-size: 19px; padding: 6px 12px; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.chip small { font: 11px "Brico", sans-serif; display: block; opacity: .85; text-transform: uppercase; }
.chip.off { opacity: .4; }
.chip.free { background: transparent; color: rgba(27,26,23,.4); border-style: dashed; box-shadow: none; }
.mrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px dashed rgba(27,26,23,.25); }
.mrow b { flex: 1; font-size: 19px; }
.tiny { width: auto; margin: 0; padding: 6px 10px; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); }
.game { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; transform: rotate(-.6deg); }
.game b { font-size: 26px; letter-spacing: -.02em; display: block; } .game small { font-size: 15px; display: block; margin-top: 2px; }
.game button { width: auto; margin: 0; padding: 10px 18px; font-size: 19px; }
.vopt { position: relative; overflow: hidden; display: flex; justify-content: space-between; text-align: left; background: var(--white); color: var(--ink); box-shadow: 5px 5px 0 var(--ink); margin: 0 0 14px; font-size: 21px; }
.vopt i { position: absolute; inset: 0 auto 0 0; background: var(--yellow); transition: width .3s; }
.vopt span { position: relative; }
.vopt.mine { box-shadow: 5px 5px 0 var(--pink); outline: 3px solid var(--pink); }
.timer { font: 800 16px "Brico", sans-serif; background: var(--ink); color: var(--paper); padding: 2px 9px; display: inline-block; transform: rotate(3deg); margin-left: 6px; vertical-align: middle; }
.how { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.how span { background: var(--white); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 6px 10px; font-weight: 800; font-size: 17px; }
.how b { color: var(--pink); margin-right: 6px; }
.demo { display: none; }
.who, .mono, .chip small, .tg, .timer { font-weight: 700; font-stretch: 78%; letter-spacing: .08em; }

@keyframes rise { from { transform: translateY(22px) rotate(var(--r, 0deg)); opacity: 0; } to { transform: rotate(var(--r, 0deg)); opacity: 1; } }
@keyframes stamp { 0% { transform: scale(1.25) rotate(-4deg); opacity: 0; } 55% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes slap { from { transform: scale(1.3) rotate(var(--r, -1deg)); opacity: 0; } 60% { opacity: 1; } to { transform: scale(1) rotate(var(--r, -1deg)); opacity: 1; } }
body:not(.ready) .wrap { visibility: hidden; } /* no flash of fallback fonts */
.in > * { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }
.in > *:nth-child(2) { animation-delay: .06s; } .in > *:nth-child(3) { animation-delay: .12s; } .in > *:nth-child(4) { animation-delay: .18s; }
.in > *:nth-child(5) { animation-delay: .24s; } .in > *:nth-child(n+6) { animation-delay: .3s; }
.start > div { animation: none !important; }
.start h1 { animation: stamp .55s cubic-bezier(.2,1.3,.4,1) both; }
.start .sticker { animation: slap .45s .25s cubic-bezier(.2,1.4,.4,1) both; --r: 2deg; }
.start .demo { animation: rise .6s .4s cubic-bezier(.16,1,.3,1) both; --r: -1.5deg; }
.start > div:last-child > * { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }
.start > div:last-child > :nth-child(2) { animation-delay: .08s; } .start > div:last-child > :nth-child(3) { animation-delay: .14s; }
.start > div:last-child > :nth-child(n+4) { animation-delay: .2s; }
.slap { animation: slap .4s cubic-bezier(.2,1.4,.4,1) both !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
/* landscape tablets, laptops, TVs: wider page, scaled up to fill the screen */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .wrap { max-width: 1240px; padding-left: 40px; padding-right: 40px; zoom: var(--z, 1); min-height: calc(100dvh / var(--z, 1)); }
  .demo { display: flex; margin-top: 34px; max-width: 560px; }
  body::before { width: 520px; height: 64px; left: -120px; bottom: 70px; }
  body::after { width: 520px; height: 64px; right: -140px; bottom: 70px; top: auto; }
  main { width: 100%; max-width: 760px; margin: 0 auto; }
  main.start { max-width: none; display: grid; grid-template-columns: 1.1fr 1fr; column-gap: 80px; align-content: center; padding-bottom: 6vh; }
  main.start h1 { font-size: clamp(64px, 8vw, 128px); }
}

/* in-game overlay: a pill bottom-left, a sheet when open; no page chrome */
html.ov, html.ov body { background: transparent; background-image: none; min-height: 0; overflow: hidden; }
html.ov body::before, html.ov body::after { display: none; }
.ov .wrap { padding: 0; max-width: none; min-height: 0; zoom: 1; }
.pill { white-space: nowrap; position: fixed; left: 8px; bottom: 8px; width: auto; margin: 0; font-size: 15px; padding: 8px 12px; box-shadow: 3px 3px 0 var(--pink); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 100%; overflow: auto; background: var(--paper); border-top: 3px solid var(--ink); padding: 12px 14px 16px;
  background-image: radial-gradient(rgba(27,26,23,.13) 1px, transparent 1.2px); background-size: 7px 7px; }
.sheet .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
.sheet .top b { font-size: 20px; }
.sheet h2 { font-size: 22px; margin-top: 14px; }
.sheet .chips { margin-bottom: 14px; }
.sheet .game b { font-size: 21px; }
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="/" title="Zur Startseite"><span>FURI</span>DA</a><div class="who" id="who"></div></header>
<main id="app"></main>
</div>
<script>
const OV = location.pathname === "/overlay";
const PARENT = OV && document.referrer ? new URL(document.referrer).origin : null;
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
const COLORS = ["#FF4F79", "#2B59C3", "#1F9E6E", "#F26419", "#6B4BD8", "#0B8A8A", "#C8372D", "#6E7F1D", "#D6336C", "#1C7ED6", "#2F9E44", "#E8590C", "#7048E8", "#0C8599", "#A61E4D", "#5C940D", "#862E9C", "#364FC7", "#B35C00", "#495057"];
const HOW = { leader: "Gleichstand – der Leader entscheidet.", lot: "Gleichstand – per Los.", "tie-stay": "Gleichstand – ihr bleibt.", none: "Keine Stimmen – ihr bleibt." };
const tilt = (i) => [-2, 1.5, -1, 2, -1.5, 1][i % 6];
const inviteCode = (location.pathname.match(/^\/p\/([A-Za-z]{4})$/) || [])[1]?.toUpperCase() || null;
let st = null, ws, note = "", openSheet = false, asked = false, autoJoined = false, voteEnds = 0, lastSize = "", lastMember = null, screen = "";

// big landscape screens: scale the page so it fills the window (only applied by the wide-screen CSS)
const fit = () => document.documentElement.style.setProperty("--z", Math.max(1, Math.min(innerWidth / 1240, innerHeight / 820)).toFixed(3));
fit(); addEventListener("resize", fit);
Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(() => document.body.classList.add("ready"));
if (OV) document.documentElement.classList.add("ov");

const out = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const gameOf = (id) => st.games.find((g) => g.id === id);
const optName = (o) => o === "stay" ? `Weiterspielen (${gameOf(st.party.game)?.name || "hier"})` : (gameOf(o)?.name || o) + (o === st.party?.game ? " – neuer Raum" : "");
const toParent = (m) => PARENT && parent.postMessage(m, PARENT);
const HUB = location.origin + "/";
// in the overlay the game page navigates; on the hub itself a link to the hub just redraws
const navigate = (url) => OV ? toParent({ party: "go", url }) : url === HUB ? render() : (location.href = url);
const playsHere = (pa) => OV && pa.game && gameOf(pa.game) && new URL(gameOf(pa.game).url).origin === PARENT;

async function start() {
  try { await fetch("/api/me", { credentials: "same-origin" }); } catch {}
  connect();
}
function connect() {
  ws = new WebSocket(location.origin.replace(/^http/, "ws"));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "state") { st = m; if (m.party?.vote) voteEnds = Date.now() + m.party.vote.left; afterState(); }
    else if (m.t === "note") { note = m.msg; render(); }
    else if (m.t === "go") navigate(m.url);
    else if (m.t === "code") toParent({ party: "code", code: m.code });
  };
  ws.onclose = (e) => setTimeout(e.code === 4001 ? start : connect, 2000);
}
// the game page asks us to leave the party (its quit panel)
addEventListener("message", (e) => {
  if (!OV || e.origin !== PARENT || e.source !== parent || e.data?.party !== "leave") return;
  leave();
});
function leave() { note = ""; openSheet = false; out({ t: "leave" }); if (OV) navigate(HUB); }

function afterState() {
  const pa = st.party;
  if (!OV && inviteCode && st.me.name && !autoJoined && pa?.code !== inviteCode) { autoJoined = true; out({ t: "join", code: inviteCode }); }
  if (OV && pa && playsHere(pa) && !pa.busy && !asked) { asked = true; out({ t: "code" }); }
  if (OV && pa?.vote) openSheet = true;
  if (OV && lastMember !== !!pa) { lastMember = !!pa; toParent({ party: "member", on: !!pa }); }
  render();
}

// ---------------------------------------------------------------- views
function partyBody() {
  const pa = st.party, lead = pa.leader === st.me.id;
  const busy = pa.busy && gameOf(pa.busy);
  const color = (id) => COLORS[pa.members.findIndex((m) => m.id === id) % COLORS.length];
  let h = "";
  if (busy) h += `<div class="info">Wechsel zu ${esc(busy.name)} … ein schlafender Server braucht bis zu einer Minute.</div>`;
  if (pa.last && !pa.vote && !busy) h += `<div class="tags"><span class="tg t0">Ergebnis</span><span class="tg t2">${esc(optName(pa.last.winner || "stay"))}</span>${HOW[pa.last.how] ? `<span class="tg">${esc(HOW[pa.last.how])}</span>` : ""}</div>`;
  h += `<div class="chips">${pa.members.map((m, i) => `<span class="chip ${m.online ? "" : "off"}" style="background:${color(m.id)};transform:rotate(${tilt(i)}deg)"><small>${m.id === pa.leader ? "Leader" : m.online ? "dabei" : "weg"}</small>${esc(m.name)}</span>`).join("")}</div>`;
  if (pa.vote) {
    const total = Object.values(pa.vote.counts).reduce((a, b) => a + b, 0) || 1;
    h += `<h2>Was spielen wir als Nächstes?<span class="timer" id="left"></span></h2>` + pa.vote.options.map((o) => `
      <button class="vopt ${pa.vote.mine === o ? "mine" : ""}" data-vote="${esc(o)}"><i style="width:${(pa.vote.counts[o] / total) * 100}%"></i>
      <span>${esc(optName(o))}</span><span>${pa.vote.counts[o]}</span></button>`).join("");
    if (lead) h += `<button class="ghost small" id="cancel">Abstimmung abbrechen</button>`;
    return h;
  }
  if (busy) return h;
  const here = pa.game && gameOf(pa.game);
  if (here && !playsHere(pa)) h += `<div class="card game"><div><small class="mono">Deine Party spielt gerade</small><b>${esc(here.name)}</b></div><button id="follow">Hin</button></div>`;
  if (lead || pa.anyone) h += `<button id="vote">Nächstes Spiel abstimmen</button>`;
  if (lead) {
    h += `<div class="or mono">${pa.game ? "Oder direkt wechseln" : "Spiel wählen"}</div>` + st.games.map((g) => `
      <div class="card game"><div><b>${esc(g.name)}</b><small>${esc(g.tag)}${g.down ? " · gerade nicht erreichbar" : ""}</small></div>
      <button data-pick="${esc(g.id)}" ${pa.members.length > g.max ? "disabled" : ""}>Los</button></div>`).join("");
    h += `<div class="or mono">Einstellungen</div><div class="opts"><button class="ghost small" id="anyone">Abstimmen: ${pa.anyone ? "alle" : "nur Leader"}</button>
      <button class="ghost small" id="secs">Dauer: ${pa.secs} s</button></div>`;
    if (pa.members.length > 1) h += `<div class="or mono">Spieler verwalten</div>` + pa.members.filter((m) => m.id !== st.me.id).map((m) => `
      <div class="mrow"><b style="color:${color(m.id)}">${esc(m.name)}</b><button class="ghost tiny" data-kick="${esc(m.id)}">Entfernen</button></div>`).join("");
  } else if (!pa.game) h += `<div class="card"><p>Gleich geht's los. <b>${esc(pa.members.find((m) => m.id === pa.leader)?.name || "Der Leader")}</b> wählt das Spiel.</p></div>`;
  return h;
}

function render() {
  const msg = note ? `<div class="${/kopiert/.test(note) ? "info" : "err"}">${esc(note)}</div>` : "";
  if (OV) return renderOverlay(msg);
  if (!st) { app.className = ""; app.innerHTML = ""; return; }
  const pa = st.party;
  $("#who").innerHTML = pa ? `<span class="code">${esc(pa.code)}</span><b>${esc(st.me.name)}</b>` : "";
  const next = pa ? "party" : "start";
  // only animate when the screen changes, not on every state update
  if (next !== screen) { app.className = pa ? "in" : "in start"; screen = next; } else app.className = pa ? "" : "start";
  if (!pa) {
    app.innerHTML = `
      <div><h1>Party-Spiele.<br>Zusammen.</h1>
      <div><span class="sticker">Ihr bleibt zusammen.</span></div>
      <div class="demo how"><span><b>1</b>Party erstellen</span><span><b>2</b>Freunde einladen</span><span><b>3</b>Spiele wechseln</span></div></div>
      <div>${msg}
      <div class="field" style="margin-top:28px"><label class="mono" for="name">Dein Name</label><input id="name" maxlength="12" autocomplete="nickname" value="${esc(st.me.name || store.get("fu_name") || "")}"></div>
      <div class="field"><label class="mono" for="code">Party-Code</label><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(inviteCode || "")}"></div>
      <button id="join">Party beitreten</button>
      <div class="or mono">oder</div>
      <button id="create" class="ghost">Neue Party erstellen</button>
      <p class="mono" style="margin-top:22px;opacity:.7;text-transform:none">Eine Party bleibt zusammen, auch wenn ihr das Spiel wechselt. Keine Konten, keine Werbung.</p></div>`;
  } else {
    app.innerHTML = `<div class="card joinbox">
        <div><span class="mono">Party-Code</span><button id="copycode" class="bigcode" title="Code kopieren">${esc(pa.code)}</button>
          <span class="mono" id="copied">Antippen zum Kopieren</span></div>
        <div class="jr"><img class="qr" src="/qr/${esc(pa.code)}.png" alt="QR-Code zum Beitreten"><button id="share" class="small">Link teilen</button></div>
      </div>
      <div class="tags"><span class="tg t0">${pa.members.filter((m) => m.online).length} / 20 dabei</span><span class="tg t2">${pa.game ? "Spielt: " + esc(gameOf(pa.game)?.name) : "Noch kein Spiel"}</span></div>
      ${msg}<div>${partyBody()}</div>
      <button class="ghost small" id="leave" style="margin-top:26px">Party verlassen</button>`;
  }
  bind();
}

function renderOverlay(msg) {
  const pa = st && st.party;
  let h = "";
  if (pa && openSheet) h = `<div class="sheet"><div class="top"><b>Party ${esc(pa.code)} · ${pa.members.length}</b><button class="ghost tiny" id="close">Zurück</button></div>${msg}${partyBody()}
    <div class="opts" style="margin-top:16px"><button class="ghost small" id="hub">Zur Lobby</button><button class="ghost small" id="leave">Party verlassen</button></div></div>`;
  else if (pa) h = `<button class="pill" id="open">Party ${esc(pa.code)} · ${pa.members.filter((m) => m.online).length}${pa.game && !playsHere(pa) ? " · woanders!" : ""}</button>`;
  app.innerHTML = h;
  bind();
  // tell the game page how much room the overlay needs
  const size = !pa ? "0,0" : openSheet ? `640,${Math.min(560, $(".sheet").scrollHeight + 4)}` : `${$(".pill").offsetWidth + 20},${$(".pill").offsetHeight + 20}`;
  if (size !== lastSize) { lastSize = size; const [w, h2] = size.split(","); toParent({ party: "size", w: +w, h: +h2 }); }
}

function bind() {
  const on = (sel, f) => { const el = $(sel); if (el) el.onclick = f; };
  const named = () => { const n = $("#name").value.trim(); if (!n) { note = "Erst deinen Namen eingeben."; render(); return false; } store.set("fu_name", n); out({ t: "name", name: n }); return true; };
  on("#join", () => {
    const c = $("#code").value.trim().toUpperCase();
    if (!named()) return;
    if (c.length !== 4) { note = "Der Party-Code hat 4 Buchstaben. Neue Party? Dann unten erstellen."; return render(); }
    note = ""; out({ t: "join", code: c });
  });
  on("#create", () => { if (named()) { note = ""; out({ t: "create" }); } });
  on("#leave", leave);
  on("#vote", () => { note = ""; out({ t: "vote-start" }); });
  on("#cancel", () => out({ t: "vote-cancel" }));
  on("#anyone", () => out({ t: "settings", anyone: !st.party.anyone, secs: st.party.secs }));
  on("#secs", () => out({ t: "settings", anyone: st.party.anyone, secs: { 20: 30, 30: 60, 60: 20 }[st.party.secs] || 30 }));
  on("#follow", () => navigate(gameOf(st.party.game).url));
  on("#open", () => { openSheet = true; render(); });
  on("#close", () => { openSheet = false; note = ""; render(); });
  on("#hub", () => navigate(HUB));
  on("#copycode", async () => {
    const c = st.party.code;
    try { await navigator.clipboard.writeText(c); $("#copied").textContent = "Code kopiert!"; }
    catch { const t = document.createElement("textarea"); t.value = c; document.body.append(t); t.select(); const ok = document.execCommand("copy"); t.remove(); $("#copied").textContent = ok ? "Code kopiert!" : "Kopieren nicht möglich"; }
    $("#copied").classList.add("ok");
  });
  on("#share", async () => {
    const url = `${location.origin}/p/${st.party.code}`;
    try { if (navigator.share) await navigator.share({ title: "FURIDA", text: "Komm in meine Party! Code " + st.party.code, url }); else { await navigator.clipboard.writeText(url); $("#share").textContent = "Link kopiert!"; } }
    catch (e) { if (e.name !== "AbortError") $("#share").textContent = url; }
  });
  document.querySelectorAll("[data-kick]").forEach((b) => b.onclick = () => { if (confirm("Wirklich aus der Party entfernen?")) out({ t: "kick", id: b.dataset.kick }); });
  document.querySelectorAll("[data-vote]").forEach((b) => b.onclick = () => out({ t: "vote", option: b.dataset.vote }));
  document.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => { note = ""; out({ t: "pick", game: b.dataset.pick }); });
  for (const id of ["name", "code"]) { const el = $("#" + id); if (el) el.onkeydown = (e) => e.key === "Enter" && $("#join").click(); }
}

setInterval(() => { const el = $("#left"); if (el) el.textContent = Math.max(0, Math.ceil((voteEnds - Date.now()) / 1000)) + " s"; }, 250);
render();
start();
</script>
</body>
</html>
