<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif">
  <!-- GRÜNDERFIEBER key art: pitch-deck slate, three brief cards, a doodled product, money flying in. Left side stays calm for the hub title. -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F2F5F7" stroke-opacity=".05" stroke-width="2"/></pattern>
    <radialGradient id="mint" cx="85%" cy="0%" r="65%"><stop offset="0" stop-color="#3DDC97" stop-opacity=".45"/><stop offset="1" stop-color="#3DDC97" stop-opacity="0"/></radialGradient>
    <radialGradient id="gold" cx="55%" cy="110%" r="55%"><stop offset="0" stop-color="#FFC857" stop-opacity=".30"/><stop offset="1" stop-color="#FFC857" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#101418"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#mint)"/>
  <rect width="1600" height="900" fill="url(#gold)"/>

  <!-- brief cards -->
  <g transform="translate(760 70) rotate(-6)"><rect width="270" height="150" rx="22" fill="#3DDC97"/>
    <text x="24" y="44" font-size="20" fill="#101418" opacity=".6" letter-spacing="3">WAS</text><text x="24" y="96" font-size="34" fill="#101418">Ein Wecker</text></g>
  <g transform="translate(1030 60) rotate(3)"><rect width="270" height="150" rx="22" fill="#FFC857"/>
    <text x="24" y="44" font-size="20" fill="#101418" opacity=".6" letter-spacing="3">FÜR WEN</text><text x="24" y="96" font-size="34" fill="#101418">für Vampire</text></g>
  <g transform="translate(1300 90) rotate(-2)"><rect width="270" height="150" rx="22" fill="#F2F5F7"/>
    <text x="24" y="44" font-size="20" fill="#101418" opacity=".6" letter-spacing="3">PROBLEM</text><text x="24" y="92" font-size="26" fill="#101418">Die Nacht ist</text><text x="24" y="124" font-size="26" fill="#101418">zu kurz.</text></g>

  <!-- product sketch on a pitch slide -->
  <g transform="translate(820 290) rotate(2)">
    <rect width="560" height="420" rx="28" fill="#FFFFFF"/>
    <g fill="none" stroke="#101418" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="280" cy="190" r="110"/>
      <path d="M280 190 L280 120 M280 190 L330 220"/>
      <path d="M195 95 L160 60 M365 95 L400 60"/>
      <path d="M210 300 L190 340 M350 300 L370 340"/>
    </g>
    <path d="M232 250 l10 22 l10 -22" fill="#FF6B6B" stroke="#101418" stroke-width="5" stroke-linejoin="round"/>
    <path d="M308 250 l10 22 l10 -22" fill="#FF6B6B" stroke="#101418" stroke-width="5" stroke-linejoin="round"/>
    <text x="280" y="392" font-size="34" fill="#101418" text-anchor="middle">DÄMMERWECKER 3000</text>
  </g>

  <!-- money flying in -->
  <g font-size="44" fill="#101418" text-anchor="middle">
    <g transform="translate(1440 360) rotate(14)"><rect x="-80" y="-38" width="160" height="76" rx="14" fill="#3DDC97"/><text y="16">+50k</text></g>
    <g transform="translate(1470 560) rotate(-8)"><rect x="-80" y="-38" width="160" height="76" rx="14" fill="#FFC857"/><text y="16">+25k</text></g>
    <g transform="translate(760 760) rotate(-12)"><rect x="-80" y="-38" width="160" height="76" rx="14" fill="#3DDC97"/><text y="16">+10k</text></g>
  </g>
  <g fill="#FFC857"><circle cx="1360" cy="790" r="34"/><circle cx="1420" cy="815" r="28" opacity=".8"/><circle cx="700" cy="620" r="20" opacity=".7"/></g>
  <text x="1360" y="802" font-size="34" fill="#101418" text-anchor="middle">€</text>
</svg>
