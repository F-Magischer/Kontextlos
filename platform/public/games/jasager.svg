<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif">
  <!-- JA-SAGER key art: game-show cream, a question card, big Ja / Nein and the number wheel. Left side stays calm for the hub title. -->
  <defs>
    <radialGradient id="sun" cx="78%" cy="8%" r="60%"><stop offset="0" stop-color="#FFC93C" stop-opacity=".75"/><stop offset="1" stop-color="#FFC93C" stop-opacity="0"/></radialGradient>
    <radialGradient id="grn" cx="100%" cy="100%" r="55%"><stop offset="0" stop-color="#18B26B" stop-opacity=".35"/><stop offset="1" stop-color="#18B26B" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".3" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <mask id="wm"><rect x="760" y="610" width="760" height="170" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1600" height="900" fill="#FFF6E5"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <rect width="1600" height="900" fill="url(#grn)"/>
  <g fill="#14213D" opacity=".07"><circle cx="300" cy="160" r="90"/><circle cx="160" cy="720" r="140"/><circle cx="560" cy="520" r="50"/></g>

  <!-- question card -->
  <g transform="translate(780 90) rotate(-3)">
    <rect x="0" y="12" width="680" height="200" rx="34" fill="#14213D"/>
    <rect width="680" height="200" rx="34" fill="#FFFFFF" stroke="#14213D" stroke-width="7"/>
    <text x="340" y="88" font-size="30" fill="#5B6478" text-anchor="middle" letter-spacing="4">FRAGE 3 / 8</text>
    <text x="340" y="150" font-size="50" fill="#14213D" text-anchor="middle">Hältst du dich für schlau?</text>
  </g>

  <!-- yes / no -->
  <g transform="translate(830 330) rotate(-5)">
    <rect x="0" y="12" width="300" height="170" rx="34" fill="#14213D"/>
    <rect width="300" height="170" rx="34" fill="#18B26B" stroke="#14213D" stroke-width="7"/>
    <text x="150" y="118" font-size="96" fill="#FFFFFF" text-anchor="middle">JA</text>
  </g>
  <g transform="translate(1180 345) rotate(4)">
    <rect x="0" y="12" width="320" height="170" rx="34" fill="#14213D"/>
    <rect width="320" height="170" rx="34" fill="#F2545B" stroke="#14213D" stroke-width="7"/>
    <text x="160" y="116" font-size="88" fill="#FFFFFF" text-anchor="middle">NEIN</text>
  </g>

  <!-- number wheel -->
  <rect x="740" y="610" width="800" height="170" rx="40" fill="#14213D"/>
  <rect x="740" y="598" width="800" height="170" rx="40" fill="#FFFFFF" stroke="#14213D" stroke-width="7"/>
  <rect x="1090" y="618" width="100" height="130" rx="24" fill="#FFC93C"/>
  <g mask="url(#wm)" font-size="84" text-anchor="middle">
    <text x="840" y="712" fill="#9AA1B1">1</text>
    <text x="960" y="712" fill="#7A8296">2</text>
    <text x="1060" y="712" fill="#5B6478">3</text>
    <text x="1140" y="716" fill="#14213D" font-size="100">4</text>
    <text x="1222" y="712" fill="#5B6478">5</text>
    <text x="1322" y="712" fill="#7A8296">6</text>
    <text x="1440" y="712" fill="#9AA1B1">7</text>
  </g>
  <text x="1140" y="830" font-size="30" fill="#14213D" text-anchor="middle" letter-spacing="3">WIE VIELE SAGEN JA?</text>
</svg>
