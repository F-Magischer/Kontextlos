<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif">
  <!-- ECHT ODER GTA? key art: Florida dusk, two tilted photos of the same beach, one tagged ECHT?, one GTA?. Left side stays calm for the hub title. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140A24"/><stop offset=".55" stop-color="#3A1457"/><stop offset=".8" stop-color="#C2366F"/><stop offset="1" stop-color="#FF9F45"/></linearGradient>
    <radialGradient id="sun" cx="72%" cy="78%" r="45%"><stop offset="0" stop-color="#FFE45C" stop-opacity=".9"/><stop offset=".35" stop-color="#FF4FA3" stop-opacity=".35"/><stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/></radialGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD3F7"/><stop offset=".55" stop-color="#FFD1A1"/><stop offset=".56" stop-color="#2EB8C9"/><stop offset="1" stop-color="#16707E"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B2A86"/><stop offset=".5" stop-color="#FF6FA8"/><stop offset=".56" stop-color="#FFB36B"/><stop offset=".57" stop-color="#2EE6D6"/><stop offset="1" stop-color="#1B6E8C"/></linearGradient>
    <g id="palm"><path d="M0 0 C 6 -70 4 -140 -6 -210" stroke="#140A24" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M-6 -210 q -60 -10 -95 25 q 50 -15 95 -25 q -40 -45 -100 -40 q 60 15 100 40 q 10 -55 -20 -95 q 25 50 20 95 q 45 -40 105 -30 q -60 5 -105 30 q 55 0 90 40 q -50 -25 -90 -40z" fill="#140A24"/></g>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <circle cx="1150" cy="720" r="150" fill="#FFE45C" opacity=".85"/>
  <g fill="#140A24" opacity=".85"><rect x="0" y="760" width="1600" height="140"/></g>
  <use href="#palm" transform="translate(860 790) scale(1.1)"/>
  <use href="#palm" transform="translate(1520 800) scale(1.35) rotate(6)"/>

  <!-- photo one: daylight -->
  <g transform="translate(905 150) rotate(-7)">
    <rect x="-14" y="-14" width="408" height="300" rx="10" fill="#FFF8F0"/>
    <rect width="380" height="230" fill="url(#p1)"/>
    <use href="#palm" transform="translate(300 230) scale(.75)"/>
    <rect x="0" y="200" width="380" height="30" fill="#F4E1C1"/>
    <rect x="20" y="244" width="150" height="34" rx="17" fill="#2EE6D6"/>
    <text x="95" y="270" text-anchor="middle" font-size="24" fill="#140A24">ECHT?</text>
  </g>
  <!-- photo two: the same beach, a little too perfect -->
  <g transform="translate(1150 300) rotate(6)">
    <rect x="-14" y="-14" width="408" height="300" rx="10" fill="#FFF8F0"/>
    <rect width="380" height="230" fill="url(#p2)"/>
    <use href="#palm" transform="translate(80 230) scale(.8)"/>
    <rect x="0" y="198" width="380" height="32" fill="#FFC9A6"/>
    <rect x="200" y="244" width="150" height="34" rx="17" fill="#FF4FA3"/>
    <text x="275" y="270" text-anchor="middle" font-size="24" fill="#FFFFFF">GTA?</text>
  </g>
  <text x="1350" y="230" font-size="150" fill="#FFE45C" opacity=".9" transform="rotate(12 1350 230)">?</text>
</svg>
