<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>GRÜNDERFIEBER</title>
<link rel="preload" href="fonts/BricolageGrotesque.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face { font-family: "Brico"; src: url("fonts/BricolageGrotesque.ttf"); font-weight: 200 800; font-stretch: 75% 100%; font-display: swap; }
/* pitch-deck look: dark slate, mint for money, gold for highlights */
:root { --bg: #101418; --s1: #181E25; --s2: #222A33; --line: rgba(242,245,247,.10); --text: #F2F5F7; --muted: #93A1AE; --mint: #3DDC97; --gold: #FFC857; --coral: #FF6B6B; --blue: #5B8CFF; }
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); color: var(--text); }
body { min-height: 100dvh; font: 17px/1.45 "Brico", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  background-image: radial-gradient(circle at 90% -10%, rgba(61,220,151,.20), transparent 40%), radial-gradient(circle at -10% 110%, rgba(255,200,87,.14), transparent 40%),
  linear-gradient(rgba(242,245,247,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(242,245,247,.035) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px; background-attachment: fixed; }
.wrap { max-width: 1000px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 40px; min-height: 100dvh; display: flex; flex-direction: column; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 14px; }
.logo { font-weight: 800; font-size: 21px; letter-spacing: .04em; color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: transform .15s; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--mint), var(--gold)); display: grid; place-items: center; font-style: normal; color: var(--bg); font-size: 15px; }
.logo:active { transform: scale(.95); }
.hr { display: flex; gap: 8px; align-items: center; }
.who { display: flex; gap: 6px; align-items: center; font-weight: 800; font-size: 13px; }
.who .code { background: var(--s2); border: 1px solid var(--line); padding: 3px 9px; border-radius: 8px; letter-spacing: .12em; }
.who b { background: var(--me, var(--mint)); color: var(--bg); padding: 3px 9px; border-radius: 8px; }
main { flex: 1; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: clamp(30px, 7vw, 54px); line-height: 1.02; letter-spacing: -.03em; font-weight: 800; }
h2 { font-size: 24px; letter-spacing: -.02em; font-weight: 800; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mint { color: var(--mint); }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
button, .btn { font: 800 19px "Brico", system-ui, sans-serif; color: var(--bg); background: var(--mint); border: 0; border-radius: 14px; padding: 14px 18px; cursor: pointer;
  transition: transform .1s, filter .1s; text-align: center; text-decoration: none; display: block; width: 100%; box-shadow: 0 10px 30px -14px rgba(61,220,151,.8); }
button:hover { filter: brightness(1.07); } button:active { transform: scale(.97); }
button:disabled { opacity: .35; cursor: default; transform: none; }
button.ghost { background: var(--s2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
button.gold { background: var(--gold); box-shadow: 0 10px 30px -14px rgba(255,200,87,.8); }
button.small { font-size: 15px; padding: 9px 12px; width: auto; border-radius: 10px; }
input { width: 100%; font: 700 19px "Brico", sans-serif; color: var(--text); background: var(--s2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
input:focus { border-color: var(--mint); box-shadow: 0 0 0 3px rgba(61,220,151,.25); }
input#code { letter-spacing: .3em; text-transform: uppercase; }
.err { background: var(--coral); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 800; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 800; font-size: 13px; } .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.stack { display: grid; gap: 12px; }
.row2 { display: grid; gap: 12px; } @media (min-width: 760px) { .row2 { grid-template-columns: 1fr 1fr; } }

.start { display: grid; gap: 22px; align-content: center; flex: 1; }
@media (min-width: 820px) { .start { grid-template-columns: 1.15fr 1fr; column-gap: 60px; } .start h1 { font-size: 66px; } }
.steps { display: flex; flex-wrap: wrap; gap: 8px; } .steps span { background: var(--s2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
.steps b { color: var(--mint); margin-right: 5px; }

/* lobby */
.joinbox { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; background: linear-gradient(135deg, rgba(61,220,151,.18), rgba(255,200,87,.12)), var(--s1); }
.bigcode { font-size: 40px; letter-spacing: .16em; background: var(--bg); color: var(--text); width: auto; display: inline-block; padding: 6px 14px; margin: 6px 0; box-shadow: none; border: 1px solid var(--line); }
.qr { width: 136px; height: 136px; border-radius: 14px; background: #fff; padding: 5px; display: block; image-rendering: pixelated; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { color: var(--bg); font-weight: 800; padding: 6px 12px; border-radius: 12px; }
.chip small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.chip.off { opacity: .35; }
.seg { display: flex; gap: 8px; } .seg button { flex: 1; font-size: 17px; padding: 10px; background: var(--s2); color: var(--text); box-shadow: none; border: 1px solid var(--line); } .seg button.on { background: var(--mint); color: var(--bg); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); row-gap: 12px; } .modes button { position: relative; }
.rec { position: absolute; top: -9px; right: 8px; background: var(--gold); color: var(--bg); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; line-height: 1.3; }
h2 .rec { position: static; vertical-align: middle; margin-left: 6px; }
.mrow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); } .mrow b { flex: 1; }

/* round header + timer */
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; }
.tbar { height: 8px; border-radius: 99px; background: var(--s2); overflow: hidden; }
.tbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), var(--gold)); transform-origin: left; }
.tbar.low i { background: var(--coral); }

/* brief cards */
.brief { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .brief { grid-template-columns: repeat(3, 1fr); } .brief.one { grid-template-columns: 1fr; } }
.bc { border-radius: 16px; padding: 14px 16px; color: var(--bg); font-weight: 800; font-size: 19px; line-height: 1.2; animation: deal .5s cubic-bezier(.2,1.3,.4,1) both; }
.bc small { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: 4px; }
.bc.a { background: var(--mint); transform: rotate(-1deg); } .bc.b { background: var(--gold); animation-delay: .08s; transform: rotate(.8deg); } .bc.c { background: #F2F5F7; animation-delay: .16s; transform: rotate(-.5deg); }
@keyframes deal { from { opacity: 0; transform: translateY(16px) rotate(-6deg) scale(.9); } }

/* drawing pad */
.pad { display: grid; gap: 10px; }
canvas { width: 100%; aspect-ratio: 4 / 3; background: #fff; border-radius: 16px; touch-action: none; display: block; cursor: crosshair; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 3px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; }
.cols { display: flex; flex-wrap: wrap; gap: 6px; }
.sw.pick { position: relative; overflow: hidden; background: conic-gradient(#FF3B30, #FFE03B, #3DDC97, #48DBFB, #5B8CFF, #C77DFF, #FF3B30); }
.sw.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.sw.on { border-color: var(--text); }
.sz { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; background: var(--s2); border: 1px solid var(--line); box-shadow: none; border-radius: 10px; }
.sz i { background: var(--text); border-radius: 50%; display: block; }
.sz.on { border-color: var(--mint); }
.tools .sp { flex: 1; }
.mode { display: flex; background: var(--s2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.mode button { width: auto; font-size: 15px; padding: 7px 12px; border-radius: 9px; background: transparent; color: var(--muted); box-shadow: none; }
.mode button.on { background: var(--mint); color: var(--bg); }

/* product card */
.product { display: grid; gap: 14px; }
@media (min-width: 760px) { .product { grid-template-columns: 1.2fr 1fr; align-items: center; } }
.product img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border-radius: 16px; display: block; }
.product .pn { font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1.02; }
.product .sl { font-size: 20px; color: var(--gold); font-style: italic; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; } .tags span { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line); }
.spot { text-align: center; padding: 22px; background: linear-gradient(135deg, rgba(61,220,151,.25), rgba(255,200,87,.18)), var(--s1); }
.tips { display: grid; gap: 6px; text-align: left; } .tips li { margin-left: 18px; }

/* invest */
.money { font-size: clamp(40px, 10vw, 64px); font-weight: 800; letter-spacing: -.03em; color: var(--mint); text-align: center; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 12px; padding: 0; border-radius: 99px; background: linear-gradient(90deg, var(--mint) var(--p, 0%), var(--s2) var(--p, 0%)); border: 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); border: 4px solid var(--bg); box-shadow: 0 0 0 2px var(--gold); }
input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); border: 4px solid var(--bg); }
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; } .quick button { font-size: 14px; padding: 9px 4px; background: var(--s2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
.progress { text-align: center; font-weight: 800; color: var(--muted); }
.ip { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px 12px; align-items: center; }
.ip img { width: 96px; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border-radius: 10px; }
.ip .amt { font-size: 22px; font-weight: 800; color: var(--mint); }
.ip input { grid-column: 1 / -1; }
.ip .sl { color: var(--gold); font-style: italic; font-size: 15px; }
.ip.own { opacity: .55; }
.left { position: sticky; top: 0; z-index: 5; background: var(--s1); }

/* results */
.res { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; animation: up .45s cubic-bezier(.16,1,.3,1) both; }
.res img { width: 96px; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border-radius: 10px; }
.res .amt { font-size: 22px; font-weight: 800; color: var(--mint); text-align: right; }
.res .by { font-size: 13px; color: var(--muted); }
.res.first { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 14px 40px -20px rgba(255,200,87,.7); }
.rank { display: grid; gap: 8px; }
.rank div { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: var(--s1); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 800; }
.rank div:first-child { background: linear-gradient(135deg, rgba(255,200,87,.3), rgba(61,220,151,.2)), var(--s1); font-size: 19px; }
.rank .m { color: var(--mint); }
.done span { display: inline-block; margin: 3px; padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 14px; background: var(--s2); color: var(--muted); }
.done span.ok { color: var(--text); } .done span.ok::before { content: "✓ "; color: var(--mint); }
@keyframes up { from { opacity: 0; transform: translateY(14px); } }

/* party: FURIDA button only in the lobby, quit dialog, party page iframe */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(5,8,10,.65); display: flex; align-items: center; justify-content: center; padding: 18px; }
.modal[hidden], .quit[hidden], .pbtn[hidden] { display: none; }
.modal .card { max-width: 420px; width: 100%; max-height: calc(100dvh - 36px); overflow-y: auto; display: grid; gap: 10px; animation: up .3s both; }
.quit { width: auto; padding: 6px 8px; line-height: 0; background: var(--s2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: none; }
.pbtn { width: auto; padding: 5px 10px; font-size: 13px; letter-spacing: .1em; border-radius: 10px; background: linear-gradient(100deg, #7C5CFF, #22D3EE); color: #fff; position: relative; box-shadow: none; }
.pbtn.away::after { content: "!"; position: absolute; top: -8px; right: -8px; background: var(--gold); color: var(--bg); border-radius: 8px; font-size: 12px; line-height: 1; padding: 2px 5px; }
body:not(.lobby):not(.home) .pbtn { display: none; }
@media (max-width: 460px) { body.inparty .who { display: none; } }
iframe.party { position: fixed; left: 0; top: 0; border: 0; z-index: 70; width: 0; height: 0; visibility: hidden; }
iframe.party.open { width: 100%; height: 100%; visibility: visible; }
.furida-ad { display: grid; gap: 4px; padding: 18px 20px; border-radius: 20px; color: #EEF0FF; text-decoration: none;
  background: radial-gradient(120% 140% at 0% 0%, #7C5CFF 0%, transparent 55%), radial-gradient(120% 140% at 100% 100%, #22D3EE 0%, transparent 50%), #0E0F1A; box-shadow: 0 14px 40px -16px rgba(124,92,255,.8); }
.furida-ad .fa-brand { font-weight: 800; font-size: 13px; letter-spacing: .22em; opacity: .85; }
.furida-ad b { font-size: 22px; line-height: 1.1; } .furida-ad small { font-size: 15px; opacity: .8; }
.furida-ad .fa-go { margin-top: 8px; font-weight: 800; font-size: 15px; justify-self: start; background: #fff; color: #0E0F1A; padding: 7px 14px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="/" title="Zur Startseite"><i>€</i>GRÜNDERFIEBER</a><div class="hr">
<button id="partyBtn" class="pbtn" hidden title="Party öffnen">FURIDA</button><button id="setBtn" class="quit" hidden title="Einstellungen" aria-label="Einstellungen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button><div class="who" id="who"></div>
<button id="quit" class="quit" hidden title="Party verlassen" aria-label="Party verlassen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M14 4H5v16h9M10 12h11M17 8l4 4-4 4"/></svg></button></div></header>
<main id="app"></main>
</div>
<div id="setbox" class="modal" hidden><div class="card"><div class="top"><h2>Einstellungen</h2><button class="small ghost" id="setClose">Fertig</button></div>
<p class="muted">Änderungen gelten ab der nächsten Runde.</p><div id="setcard" class="stack"></div></div></div>
<div id="quitbox" class="modal" hidden><div class="card"><h2>Party verlassen?</h2><p class="muted">Du verlässt die Party und gehst zurück zur Lobby.</p>
<button id="quitYes">Ja, verlassen</button><button id="quitNo" class="ghost">Nein, zurück</button></div></div>
<script>
// the bare Render address is another site: no party, no FURIDA. Always use the public one.
if (location.hostname.endsWith(".onrender.com")) location.replace("https://gruenderfieber.furida.workers.dev" + location.pathname + location.search + location.hash);
const $ = (s) => document.querySelector(s);
const app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
// FURIDA party overlay: only on the platform domain (local tests: localStorage gf_party = "http://localhost:8090")
const PARTY = location.hostname.endsWith(".furida.workers.dev") ? "https://play.furida.workers.dev" : store.get("gf_party");
const furidaAd = () => `<a class="furida-ad" id="furidaAd" href="${PARTY}/" target="_top"><span class="fa-brand">FURIDA</span>
  <b>Mehr Multiplayer-Spiele für eure Runde</b><small>Eure Party bleibt zusammen – das nächste Spiel wählt ihr per Abstimmung.</small><span class="fa-go">Spiele entdecken →</span></a>`;
const devId = () => { let d = store.get("gf_dev"); if (!d) { d = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("gf_dev", d); } return d; };
const REC = "problem"; // marked as recommended in the settings
const MODES = {
  zufall: ["Zufall", "Das Spiel teilt die Karten aus: was, für wen, welches Problem. Einmal pro Runde darf man neu ziehen."],
  auftrag: ["Auftrag", "Reihum ist jede Runde eine Person der Kunde: Sie schreibt die drei Karten, alle anderen erfinden dazu – und sie investiert."],
  kette: ["Kettenbrief", "Jede:r schreibt einen Teil, die Karte wandert weiter: Was → Für wen → Problem. Erfinden muss die nächste Person."],
  problem: ["Problem", "Jede:r denkt sich nur ein Problem aus und gibt es weiter. Die nächste Person erfindet irgendwas, das es löst."],
};
const eur = (k) => (k * 1000).toLocaleString("de-DE") + " €";
// FURIDA party overlay: only on the platform domain (local tests: localStorage gf_party = "http://localhost:8090")
let ws, me = null, joining = false, st = null, shown = "", ends = 0, partyCode = null;
// the drawing lives outside the DOM, so redraws of the screen never lose it
let actions = [], tool = "pen", ink = "#101418", size = 8, pname = "", pslogan = "", sentRound = 0, alloc = {}, allocRound = 0;

function connect(code, name, create = false, party = null) {
  joining = true;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
  ws.onopen = () => ws.send(JSON.stringify(party ? { t: "join", party } : create ? { t: "create", name, dev: devId() } : { t: "join", code, name, dev: devId(), pid: store.get("gf_pid_" + code) }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "joined" || m.t === "error") joining = false;
    if (m.t === "joined") {
      if (window.GF_BUILD && m.build !== window.GF_BUILD) return location.reload(); // new version deployed: load it
      window.GF_BUILD = m.build;
      me = m; store.set("gf_pid_" + m.code, m.id); store.set("gf_name", m.name);
      history.replaceState(null, "", "?code=" + m.code);
    }
    else if (m.t === "error") { me = null; startScreen(m.msg); usePartyCode(); }
    else if (m.t === "party" && /^https?:\/\//.test(m.url)) location.href = m.url; // a party plays here: join it first
    else if (m.t === "state") show(m.d);
  };
  ws.onclose = () => { if (me) setTimeout(() => connect(me.code, me.name), 1500); };
}
const out = (d) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t: "msg", d }));

function startScreen(err) {
  shown = ""; st = null; document.body.classList.remove("lobby"); document.body.classList.add("home");
  $("#who").innerHTML = "";
  const code0 = new URLSearchParams(location.search).get("code") || "";
  app.innerHTML = `<div class="start">
    <div class="stack"><span class="label">Partyspiel · 2–12 Leute</span><h1>Erfinde Unsinn.<br><span class="mint">Verkauf ihn teuer.</span></h1>
      <p class="muted">Du ziehst drei Karten, erfindest daraus ein Produkt, zeichnest es und pitchst es den anderen. Die investieren Spielgeld – wer am meisten Kapital einsammelt, gewinnt.</p>
      <div class="steps"><span><b>1</b>Karten ziehen</span><span><b>2</b>Produkt zeichnen</span><span><b>3</b>Pitchen</span><span><b>4</b>Kapital kassieren</span></div></div>
    <div class="card stack">${err ? `<div class="err">${esc(err)}</div>` : ""}
      <div><label class="label" for="name">Dein Name</label><input id="name" maxlength="12" autocomplete="nickname" value="${esc(store.get("gf_name") || "")}"></div>
      <div><label class="label" for="code">Raumcode</label><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD" value="${esc(code0)}"></div>
      <button id="go">Mitspielen</button><div class="or">oder</div><button id="new" class="ghost">Neuen Raum erstellen</button></div></div>
    ${PARTY ? furidaAd() : ""}`;
  $("#go").onclick = () => {
    const code = $("#code").value.trim().toUpperCase(), name = $("#name").value.trim();
    if (!name) return startScreen("Erst deinen Namen eingeben.");
    if (code.length !== 4) return startScreen("Der Raumcode hat 4 Buchstaben. Neuer Raum? Dann unten erstellen.");
    $("#go").disabled = true; connect(code, name);
  };
  $("#new").onclick = () => { const name = $("#name").value.trim(); if (!name) return startScreen("Erst deinen Namen eingeben."); $("#new").disabled = true; connect("", name, true); };
  for (const id of ["name", "code"]) $("#" + id).onkeydown = (e) => { if (e.key === "Enter") $("#go").click(); };
}

// ---------------------------------------------------------------- screens
const player = (id) => st.players.find((p) => p.id === id);
const doneList = (ids) => `<div class="done">${st.players.filter((p) => p.online).map((p) => `<span class="${ids.has(p.id) ? "ok" : ""}">${esc(p.name)}</span>`).join("")}</div>`;
const head = (what) => `<div class="top"><span>Runde ${st.round} / ${st.rounds} · ${what}</span><span id="secs"></span></div><div class="tbar" id="tbar"><i></i></div>`;
const briefCards = (b) => !b.what ? `<div class="brief one"><div class="bc c"><small>Löse dieses Problem</small>${esc(b.problem)}</div></div>` : `<div class="brief"><div class="bc a"><small>Was</small>${esc(b.what)}</div><div class="bc b"><small>Für wen</small>${esc(b.who)}</div><div class="bc c"><small>Welches Problem</small>${esc(b.problem)}</div></div>`;
const productCard = (p) => `<div class="card product"><img src="${esc(p.img)}" alt="Zeichnung von ${esc(p.product)}">
  <div class="stack"><span class="label">von ${esc(p.name)}</span><div class="pn">${esc(p.product)}</div>${p.slogan ? `<div class="sl">„${esc(p.slogan)}“</div>` : ""}
  <div class="tags">${[p.brief.what, p.brief.who, p.brief.problem].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("")}</div></div></div>`;

function show(d) {
  st = d;
  ends = Date.now() + d.left;
  document.body.classList.toggle("lobby", d.phase === "lobby"); document.body.classList.remove("home");
  const you = player(d.you);
  if (you) { document.documentElement.style.setProperty("--me", you.color); $("#who").innerHTML = `<span class="code">${esc(d.party || d.code)}</span><b>${esc(you.name)}</b>`; }
  const p = d.pitch;
  const key = d.phase === "write" ? `write:${d.round}:${d.write.step}:${d.write.done}`
    : d.phase === "develop" ? `dev:${d.round}:${d.submitted}:${d.playing}:${d.rerolled}`
    : d.phase === "pitch" ? `pitch:${d.round}:${p.index}`
    : d.phase === "invest" ? `invest:${d.round}:${d.invest.sent}:${d.invest.can}`
    : d.phase === "results" || d.phase === "end" ? `${d.phase}:${d.round}:${d.vip}`
    : "lobby:" + JSON.stringify(d.players) + [d.rounds, d.vip, d.mode, d.same, d.drawSecs, d.pitchSecs];
  $("#setBtn").hidden = !(d.vip && d.phase !== "lobby");
  if (!d.vip) $("#setbox").hidden = true;
  if (!$("#setbox").hidden) $("#setcard").innerHTML = settings(d);
  if (key === shown) return update();
  shown = key;
  ({ lobby, write, develop, pitch, invest: investScreen, results: resultsScreen, end })[d.phase]();
}
// small live bits that change without redrawing the screen
function update() {
  if (st.phase === "develop" || st.phase === "write") { const el = $("#done"); if (el) el.innerHTML = doneList(new Set(st.players.filter((p) => p.done).map((p) => p.id))); }
  if (st.phase === "invest") { const el = $("#progress"); if (el) el.textContent = `${st.invest.decided} von ${st.invest.needed} haben investiert`; }
}

function lobby() {
  const d = st, on = d.players.filter((p) => p.online);
  app.innerHTML = `<div class="card joinbox"><div><span class="label">${d.party ? "Party-Code" : "Raumcode"}</span><br><button class="bigcode" id="copy">${esc(d.party || d.code)}</button><br><span class="label" id="copied">Antippen zum Kopieren</span></div>
      <div class="stack"><img class="qr" src="/qr/${esc(d.code)}.png" alt="QR-Code zum Beitreten"><button class="small" id="share">Link teilen</button></div></div>
    <div class="stack"><span class="label">${on.length} / ${d.max} Gründer:innen</span><div class="chips">${d.players.map((p) => `<span class="chip ${p.online ? "" : "off"}" style="background:${esc(p.color)}"><small>${p.vip ? "Boss" : "dabei"}</small>${esc(p.name)}</span>`).join("")}</div></div>
    <div class="card stack">${settings(d)}</div>

      <button id="start" ${on.length >= d.min ? "" : "disabled"}>${on.length >= d.min ? "Alle da – los geht's!" : `Noch ${d.min - on.length} fehlen`}</button></div>
      ${d.players.length > 1 ? `<div class="stack"><span class="label">Spieler verwalten</span>${d.players.filter((p) => p.id !== d.you).map((p) => `<div class="mrow"><b style="color:${esc(p.color)}">${esc(p.name)}</b><button class="small ghost" data-kick="${esc(p.id)}">Kicken</button></div>`).join("")}</div>` : ""}`
      : `<div class="card"><p>${d.rounds} ${d.rounds === 1 ? "Runde" : "Runden"}. <b>${esc(d.players.find((p) => p.vip)?.name || "Der Boss")}</b> startet das Spiel.</p></div>`}
    <div class="card stack"><h2>So geht's</h2>
      <p class="muted"><b>1.</b> Du bekommst deine Aufgabe: was, für wen, welches Problem – oder nur ein Problem. Je nach Modus vom Spiel oder von den anderen.</p>

      <p class="muted"><b>4.</b> Nach allen Pitches verteilt jede:r sein Rundenbudget von ${eur(d.budgetMax)} auf die Produkte der anderen. Wer am Ende das meiste Kapital eingesammelt hat, gewinnt.</p></div>
    ${PARTY ? furidaAd() : ""}`;
  $("#copy").onclick = async () => { try { await navigator.clipboard.writeText(d.party || d.code); $("#copied").textContent = "Kopiert!"; } catch { $("#copied").textContent = d.party || d.code; } };

// settings: the boss changes them in the lobby or (dialog) during the game; others see a summary
const secs = (n) => n < 60 ? n + " Sekunden" : n === 60 ? "eine Minute" : n / 60 + " Minuten";
function settings(d) {
  const seg = (attr, list, cur, label) => `<div class="seg">${list.map((v) => `<button data-${attr}="${v}" class="${v === cur ? "on" : ""}">${label(v)}</button>`).join("")}</div>`;
  if (!d.vip) return `<span class="label">Spielmodus</span><h2>${MODES[d.mode][0]}${d.mode === REC ? `<span class="rec">Empfohlen</span>` : ""}</h2><p class="muted">${MODES[d.mode][1]}</p>
    ${d.mode === "zufall" ? `<p class="muted">${d.same ? "Alle bekommen dieselben Karten." : "Jede:r bekommt eigene Karten."}</p>` : ""}
    <p class="muted">${d.rounds} ${d.rounds === 1 ? "Runde" : "Runden"} · ${d.drawSecs / 60} Min. zeichnen · ${d.pitchSecs} s pitchen</p>`;
  return `<span class="label">Spielmodus</span><div class="seg modes">${Object.entries(MODES).map(([k, m]) => `<button data-mode="${k}" class="${k === d.mode ? "on" : ""}">${m[0]}${k === REC ? `<span class="rec">Empfohlen</span>` : ""}</button>`).join("")}</div>
    <p class="muted">${MODES[d.mode][1]}</p>
    ${d.mode === "zufall" ? seg("same", [0, 1], +d.same, (v) => v ? "Gleiche Karten für alle" : "Jede:r eigene Karten") : ""}
    <span class="label">Zeichenzeit</span>${seg("draw", d.drawChoices, d.drawSecs, (v) => v / 60 + " Min.")}
    <span class="label">Pitchzeit</span>${seg("pitch", d.pitchChoices, d.pitchSecs, (v) => v + " s")}
    <span class="label">Runden (jede:r pitcht einmal pro Runde)</span>${seg("rounds", d.roundChoices, d.rounds, (v) => v)}`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-mode],[data-same],[data-draw],[data-pitch],[data-rounds]");
  if (!b || !st?.vip) return;
  const k = b.dataset;
  if (k.rounds) out({ a: "rounds", value: +k.rounds });
  else out({ a: "settings", ...(k.mode ? { mode: k.mode } : k.same ? { same: k.same === "1" } : k.draw ? { draw: +k.draw } : { pitch: +k.pitch }) });
});
$("#setBtn").onclick = () => { $("#setcard").innerHTML = settings(st); $("#setbox").hidden = false; };
$("#setClose").onclick = () => { $("#setbox").hidden = true; };
$("#setbox").addEventListener("click", (e) => { if (e.target.id === "setbox") $("#setbox").hidden = true; });

// ---------------------------------------------------------------- write: the client's brief, or one part of a chain card
const FIELD = { what: ["Was soll erfunden werden?", "z. B. Ein Wecker"], who: ["Für wen?", "z. B. für Vampire"], problem: ["Welches Problem löst es?", "z. B. Die Nacht ist zu kurz."] };
function write() {
  const d = st, w = d.write, done = new Set(d.players.filter((p) => p.done).map((p) => p.id));
  const what = w.kind === "auftrag" ? "Auftrag" : w.kind === "problem" ? "Problem" : `Kettenbrief ${w.step + 1} / 3`;
  if (!w.task || w.done) {
    app.innerHTML = head(what) + `<div class="card spot stack"><h2>${w.task ? "Weitergegeben!" : w.kind === "auftrag" ? `${esc(w.setter)} schreibt gerade euren Auftrag …` : "Die anderen schreiben …"}</h2>
      <p class="muted">${w.kind === "auftrag" ? "Gleich bekommen alle dieselbe Aufgabe – und erfinden etwas völlig anderes." : w.kind === "problem" ? "Gleich bekommst du das Problem von jemand anderem." : "Jede Karte wandert weiter, bis sie Was, Für wen und Problem hat."}</p></div><div id="done">${doneList(done)}</div>`;
    return;
  }
  const t = w.task, prev = [["what", "Was"], ["who", "Für wen"]].filter(([k]) => t.prev[k]);
  app.innerHTML = head(what) + `<div class="card stack"><h2>${w.kind === "auftrag" ? "Du bist diese Runde der Kunde!" : w.kind === "problem" ? "Denk dir ein Problem aus" : "Dein Teil der Karte"}</h2>
      <p class="muted">${w.kind === "auftrag" ? "Gib allen anderen vor, was sie erfinden sollen. Du pitchst diese Runde nicht, sondern investierst nur." : w.kind === "problem" ? "Je absurder, desto besser. Die nächste Person muss etwas erfinden, das es löst. Leer lassen = Zufallsproblem."
        : w.step === 0 ? "Schreib, was erfunden werden soll. Danach wandert die Karte weiter und die nächsten ergänzen sie. Leer lassen = Zufallskarte."
        : "Lies, was dein Vordermann geschrieben hat, und schreib deinen Teil dazu. Leer lassen = Zufallskarte."}</p>
      ${prev.length ? `<div class="brief">${prev.map(([k, l], i) => `<div class="bc ${"ab"[i]}"><small>${l}</small>${esc(t.prev[k])}</div>`).join("")}</div>` : ""}
      ${t.fields.map((f) => `<div><label class="label" for="w_${f}">${w.kind === "problem" ? "Das Problem" : FIELD[f][0]}</label><input id="w_${f}" maxlength="60" placeholder="${FIELD[f][1]}"></div>`).join("")}
      <button id="send" class="gold">${w.kind === "auftrag" ? "Auftrag vergeben" : "Weitergeben"}</button></div><div id="done">${doneList(done)}</div>`;
  $("#send").onclick = () => { const o = { a: "write" }; t.fields.forEach((f) => { o[f] = $("#w_" + f).value; }); $("#send").disabled = true; out(o); };
}

// ---------------------------------------------------------------- develop: brief, drawing, name, slogan
function develop() {
  const d = st;
  if (sentRound !== d.round && !d.submitted && d.round !== develop.round) { actions = []; pname = ""; pslogan = ""; develop.round = d.round; }
  const done = new Set(d.players.filter((p) => p.done).map((p) => p.id));
  if (!d.playing) {
    app.innerHTML = head("Entwickeln") + `<div class="card stack">${d.setter ? `<h2>Dein Auftrag ist raus.</h2><p class="muted">Die anderen erfinden jetzt etwas dazu. Danach entscheidest du, wo du investierst.</p>`
      : `<h2>Gleich bist du dabei.</h2><p class="muted">Ab der nächsten Runde gründest du mit.</p>`}<div id="done">${doneList(done)}</div></div>`;
    return;
  }
  if (d.submitted) {
    app.innerHTML = head("Entwickeln") + `<div class="card stack" style="text-align:center"><span class="label">Eingereicht</span><h2>${esc(pname || "Deine Idee")}</h2>
      <p class="muted">Bereite deinen Pitch vor: Was ist es? Welches Problem löst es? Warum muss man es haben?</p><div id="done">${doneList(done)}</div></div>`;
    return;
  }
  const COLS = ["#101418", "#6B7280", "#C8CDD2", "#FFFFFF", "#9B1C1C", "#FF3B30", "#FF6B6B", "#FF8FC8", "#F368E0", "#8E44AD", "#C77DFF", "#1E3A8A",
    "#5B8CFF", "#48DBFB", "#00A8A8", "#3DDC97", "#2E9E44", "#A3E635", "#6B7F2A", "#FFE03B", "#FFC857", "#FF9F43", "#8B5A2B", "#E0B386", "#F5CBA7"];
  const by = d.brief.by && d.brief.by.length ? `<span class="label">Karte von ${d.brief.by.map(esc).join(" → ")}</span>` : "";
  app.innerHTML = head("Entwickeln") + by + briefCards(d.brief)
    + (d.rerollable && !d.rerolled ? `<button class="ghost small" id="reroll">Neue Karten ziehen (1× pro Runde)</button>` : "")
    + `<div class="card pad"><canvas id="pad" width="800" height="600"></canvas>
      <div class="tools"><div class="mode"><button class="${tool === "pen" ? "on" : ""}" data-t="pen">✏️ Stift</button><button class="${tool === "fill" ? "on" : ""}" data-t="fill">🪣 Füllen</button></div>
        <span class="sp"></span><button class="small ghost" id="undo">Zurück</button><button class="small ghost" id="clear">Leeren</button></div>
      <div class="cols">${COLS.map((c) => `<button class="sw ${c === ink ? "on" : ""}" data-c="${c}" style="background:${c}" title="${c === "#FFFFFF" ? "Weiß / Radierer" : "Farbe"}" aria-label="Farbe ${c}"></button>`).join("")}
        <label class="sw pick ${COLS.includes(ink) ? "" : "on"}" title="Eigene Farbe"${COLS.includes(ink) ? "" : ` style="background:${ink}"`}><input type="color" id="cpick" value="${ink}" aria-label="Eigene Farbe"></label></div>
      <div class="tools"><span class="sp"></span>${[4, 8, 18].map((s) => `<button class="sz ${s === size ? "on" : ""}" data-s="${s}" aria-label="Pinsel ${s}"><i style="width:${s + 2}px;height:${s + 2}px"></i></button>`).join("")}</div></div>
    <div class="row2"><div><label class="label" for="pname">Produktname</label><input id="pname" maxlength="30" placeholder="z. B. Sockenradar 3000" value="${esc(pname)}"></div>
      <div><label class="label" for="pslogan">Slogan</label><input id="pslogan" maxlength="90" placeholder="z. B. Nie wieder einsam im Trockner." value="${esc(pslogan)}"></div></div>
    <button id="submit" class="gold">Idee einreichen</button><div id="done">${doneList(done)}</div>`;
  if (d.rerollable && !d.rerolled) $("#reroll").onclick = () => out({ a: "reroll" });
  $("#pname").oninput = (e) => { pname = e.target.value; };
  $("#pslogan").oninput = (e) => { pslogan = e.target.value; };
  const pickOne = (sel, el) => app.querySelectorAll(sel).forEach((x) => x.classList.toggle("on", x === el));
  app.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { tool = b.dataset.t; pickOne("[data-t]", b); });
  app.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => { ink = b.dataset.c; pickOne("[data-c], .pick", b); });
  $("#cpick").oninput = (e) => { ink = e.target.value.toUpperCase(); const l = e.target.parentNode; l.style.background = ink; pickOne("[data-c], .pick", l); };
  app.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { size = +b.dataset.s; tool = "pen"; pickOne("[data-s]", b); pickOne("[data-t]", app.querySelector('[data-t="pen"]')); });
  $("#undo").onclick = () => { actions.pop(); paint(); };
  $("#clear").onclick = () => { actions = []; paint(); };
  $("#submit").onclick = submit;
  drawing($("#pad"));
}

// the picture is a list of actions (strokes and fills), replayed on undo; new strokes are drawn incrementally
const line = (g, s, from) => {
  g.strokeStyle = s.c; g.lineWidth = s.w; g.lineCap = g.lineJoin = "round"; g.beginPath();
  const p = s.p.slice(Math.max(0, from - 1));
  p.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  if (p.length === 1) g.lineTo(p[0][0] + .1, p[0][1]);
  g.stroke();
};
function paint() {
  const cv = $("#pad"); if (!cv) return;
  const g = cv.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
  for (const a of actions) a.f ? flood(g, a.x, a.y, a.c) : line(g, a, 0);
}
// bucket fill: every pixel connected to (x, y) and close to its colour takes the new colour
function flood(g, x, y, hex) {
  const W = g.canvas.width, H = g.canvas.height, img = g.getImageData(0, 0, W, H), px = img.data;
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const at = (y * W + x) * 4, t = [px[at], px[at + 1], px[at + 2]];
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  if (Math.abs(t[0] - c[0]) + Math.abs(t[1] - c[1]) + Math.abs(t[2] - c[2]) < 10) return;
  const TOL = 110; // also swallows the soft anti-aliased edge pixels of strokes
  const near = (i) => Math.abs(px[i] - t[0]) + Math.abs(px[i + 1] - t[1]) + Math.abs(px[i + 2] - t[2]) <= TOL;
  const seen = new Uint8Array(W * H), stack = [y * W + x];
  while (stack.length) {
    const p = stack.pop();
    if (seen[p]) continue;
    seen[p] = 1;
    const i = p * 4;
    if (!near(i)) continue;
    px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2]; px[i + 3] = 255;
    const px0 = p % W;
    if (px0 > 0) stack.push(p - 1);
    if (px0 < W - 1) stack.push(p + 1);
    if (p >= W) stack.push(p - W);
    if (p < W * (H - 1)) stack.push(p + W);
  }
  g.putImageData(img, 0, 0);
}
function drawing(cv) {
  paint();
  const g = cv.getContext("2d", { willReadFrequently: true });
  let cur = null;
  const at = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = (e) => {
    const [x, y] = at(e);
    if (tool === "fill") { actions.push({ f: true, x, y, c: ink }); flood(g, x, y, ink); return; }
    cv.setPointerCapture(e.pointerId);
    cur = { c: ink, w: ink === "#FFFFFF" ? size * 3 : size, p: [[x, y]] };
    actions.push(cur); line(g, cur, 0);
  };
  cv.onpointermove = (e) => { if (!cur) return; cur.p.push(at(e)); line(g, cur, cur.p.length - 1); };
  cv.onpointerup = cv.onpointercancel = () => { cur = null; };
}
function submit() {
  if (!st || st.phase !== "develop" || st.submitted || sentRound === st.round) return;
  sentRound = st.round;
  out({ a: "submit", name: pname, slogan: pslogan, img: $("#pad") ? $("#pad").toDataURL("image/png") : blank() });
}
const blank = () => { const c = document.createElement("canvas"); c.width = 800; c.height = 600; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 800, 600); return c.toDataURL("image/png"); };

// ---------------------------------------------------------------- pitch + invest
function pitch() {
  const d = st, p = d.pitch, mine = p.id === d.you;
  const top = head(`Pitch ${p.index} / ${p.count}`);
  {
    app.innerHTML = top + (mine
      ? `<div class="card spot stack"><h1>Du bist dran!</h1><p>Überzeug die Investoren – laut und mit voller Überzeugung.</p>
          <ul class="tips muted"><li>Was ist dein Produkt?</li><li>Welches Problem löst es?</li><li>Warum muss man es haben?</li><li>Was macht es einzigartig?</li></ul></div>`
      : `<div class="card spot"><h2>${esc(p.name)} pitcht gerade</h2><p class="muted">Hör gut zu – investiert wird nach dem letzten Pitch.</p></div>`)
      + productCard(p) + (mine || d.vip ? `<button id="done" class="${mine ? "gold" : "ghost"}">${mine ? "Pitch beenden" : "Pitch überspringen"}</button>` : "");
    if (mine || d.vip) $("#done").onclick = () => out({ a: "done" });
    return;
  }
}

function investScreen() {
  const d = st, v = d.invest, top = head("Investieren");
  if (!v.can || v.sent) {
    app.innerHTML = top + `<div class="card spot stack"><h2>${v.sent ? "Investiert!" : "Die anderen investieren …"}</h2><p class="muted">Gleich seht ihr, wer die Investoren überzeugt hat.</p></div>
      <div class="progress" id="progress">${v.decided} von ${v.needed} haben investiert</div>`;
    return;
  }
  if (allocRound !== d.round) { alloc = {}; allocRound = d.round; }
  const left = () => d.budget - Object.values(alloc).reduce((s, a) => s + a, 0);
  app.innerHTML = top + `<div class="card stack left"><div class="top"><span>Verteil dein Budget</span><span class="money" id="left" style="font-size:28px">${eur(left())}</span></div>
      <p class="muted">Schieb Geld in die Produkte, die dich überzeugt haben. Was du nicht verteilst, verfällt.</p></div>
    ${v.products.map((p) => p.id === d.you ? `<div class="card ip own"><img src="${esc(p.img)}" alt=""><div><b>${esc(p.product)}</b><div class="muted">Dein Produkt</div></div></div>`
      : `<div class="card ip"><img src="${esc(p.img)}" alt="Zeichnung von ${esc(p.product)}"><div><b>${esc(p.product)}</b><div class="muted">von ${esc(p.name)}</div>${p.slogan ? `<div class="sl">„${esc(p.slogan)}“</div>` : ""}</div>
        <span class="amt" id="a_${esc(p.id)}">${eur(alloc[p.id] || 0)}</span>
        <input type="range" data-to="${esc(p.id)}" min="0" max="${d.budget}" step="${d.step}" value="${alloc[p.id] || 0}" aria-label="Investition in ${esc(p.product)}"></div>`).join("")}
    <button id="invest" class="gold">Investition abschicken</button>
    <div class="progress" id="progress">${v.decided} von ${v.needed} haben investiert</div>`;
  const paintSlider = (el) => el.style.setProperty("--p", (d.budget ? el.value / d.budget * 100 : 0) + "%");
  app.querySelectorAll("[data-to]").forEach((el) => {
    paintSlider(el);
    el.oninput = () => { // never more than the budget: the slider stops at what is left
      const to = el.dataset.to, max = left() + (alloc[to] || 0);
      alloc[to] = Math.min(+el.value, max); el.value = alloc[to]; paintSlider(el);
      $("#a_" + CSS.escape(to)).textContent = eur(alloc[to]); $("#left").textContent = eur(left());
    };
  });
  $("#invest").onclick = sendInvest;
}
function sendInvest() {
  if (st?.phase !== "invest" || !st.invest.can || st.invest.sent || sendInvest.round === st.round) return;
  sendInvest.round = st.round;
  out({ a: "invest", alloc });
}

// ---------------------------------------------------------------- results + end
const resultList = (list) => list.map((r, i) => `<div class="card res ${i === 0 && r.raised ? "first" : ""}" style="animation-delay:${i * .07}s"><img src="${esc(r.img)}" alt="">
  <div><b>${esc(r.product)}</b><div class="by">von ${esc(r.name)}${r.investors.length ? " · " + r.investors.map((x) => `${esc(x.name)} ${x.amount}k`).join(", ") : " · keine Investoren"}</div></div>
  <div class="amt">${eur(r.raised)}</div></div>`).join("");
const ranking = () => `<div class="rank">${[...st.players].sort((a, b) => b.money - a.money).map((p, i) => `<div><span>${i === 0 ? "🏆" : i + 1 + "."}</span><span style="color:${esc(p.color)}">${esc(p.name)}</span><span class="m">${eur(p.money)}</span></div>`).join("")}</div>`;

function resultsScreen() {
  const d = st;
  app.innerHTML = head("Ergebnis") + `<h2>Wer hat die Investoren überzeugt?</h2>${resultList(d.results.list)}
    <h2>Gesamtkapital</h2>${ranking()}
    ${d.vip ? `<button id="next">Nächste Runde</button>` : `<p class="progress">Gleich geht's weiter …</p>`}`;
  if (d.vip) $("#next").onclick = () => out({ a: "next" });
}
function end() {
  const d = st, best = [...d.players].sort((a, b) => b.money - a.money)[0];
  app.innerHTML = `<div class="card spot stack"><span class="label">Endstand</span><h1>${esc(best?.name || "")} ist Gründer:in des Jahres!</h1><div class="money">${eur(best?.money || 0)}</div></div>
    ${ranking()}${d.results ? `<h2>Letzte Runde</h2>${resultList(d.results.list)}` : ""}
    ${d.vip ? `<button id="again">Nochmal spielen</button>` : `<p class="progress">${esc(d.players.find((p) => p.vip)?.name || "Der Boss")} kann eine neue Runde starten.</p>`}
    ${PARTY ? furidaAd() : ""}`;
  if (d.vip) $("#again").onclick = () => out({ a: "restart" });
}

// timer; at the end of developing, phones hand in whatever they have
setInterval(() => {
  if (!st) return;
  const left = Math.max(0, ends - Date.now()), s = $("#secs"), bar = $("#tbar");
  const total = (st.total || 60) * 1000;
  if (s) s.textContent = Math.ceil(left / 1000) + " s";
  if (bar) { bar.firstChild.style.transform = `scaleX(${Math.min(1, left / total)})`; bar.classList.toggle("low", left < 10000); }
  if (st.phase === "develop" && st.playing && !st.submitted && left < 1500) submit();
  if (st.phase === "invest" && left < 1500) sendInvest();
}, 200);

startScreen();
const q0 = new URLSearchParams(location.search).get("code");
if (q0 && store.get("gf_pid_" + q0.toUpperCase())) connect(q0.toUpperCase(), store.get("gf_name") || "");

// ---------------------------------------------------------------- FURIDA party
function usePartyCode() {
  if (!partyCode || me || joining) return;
  connect(null, null, false, partyCode);
  partyCode = null;
}
if (PARTY) {
  const f = document.createElement("iframe");
  f.src = PARTY + "/overlay";
  f.title = "Party";
  f.className = "party"; // hidden until the FURIDA button (or a vote) opens it full screen
  document.body.append(f);
  addEventListener("message", (e) => {
    if (e.origin !== PARTY || e.source !== f.contentWindow || !e.data) return;
    const m = e.data;
    if (m.party === "open") f.classList.toggle("open", !!m.on);
    else if (m.party === "go" && /^https?:\/\//.test(m.url)) location.href = m.url;
    else if (m.party === "code") { partyCode = String(m.code); usePartyCode(); }
    else if (m.party === "member") {
      $("#quit").hidden = !m.on;
      document.body.classList.toggle("inparty", !!m.on);
      $("#partyBtn").classList.toggle("away", !!m.away);
    }
  });
  const askQuit = (e) => { if ($("#quit").hidden) return; e.preventDefault(); $("#quitbox").hidden = false; };
  document.querySelector(".logo").addEventListener("click", askQuit);
  $("#quit").onclick = askQuit;
  // FURIDA button and ad: in a party they open the party page on top; otherwise the hub (in a new tab, so a running game stays open)
  const toHub = (e) => { e.preventDefault(); if (document.body.classList.contains("inparty")) return f.contentWindow.postMessage({ party: "open" }, PARTY); window.open(PARTY + "/", me ? "_blank" : "_top"); };
  $("#partyBtn").hidden = false;
  $("#partyBtn").onclick = toHub;
  document.addEventListener("click", (e) => { if (e.target.closest("#furidaAd")) toHub(e); });
  $("#quitNo").onclick = () => { $("#quitbox").hidden = true; };
  $("#quitYes").onclick = () => { $("#quitYes").disabled = true; f.contentWindow.postMessage({ party: "leave" }, PARTY); };
  $("#quitbox").addEventListener("click", (e) => { if (e.target.id === "quitbox") $("#quitbox").hidden = true; });
}
</script>
</body>
</html>
